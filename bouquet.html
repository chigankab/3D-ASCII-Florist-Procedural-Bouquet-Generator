      const partId = mesh.nextPartId();
      stems.addSegment(pBase, pMid, colors.inner, colors.mid, 1, 0.14, 0.28, partId, 0);
      stems.addSegment(pMid, pTip, colors.mid, colors.edge, 1, 0.28, 0.42, partId, 42);
    }
  }

  function addFlowerSpike(mesh, stems, pos, dir, radius, colors, leafCol) {
    const basis = buildBasis(dir[0], dir[1], dir[2]);
    const spikeLen = radius * 2.4;
    const tip = [
      pos[0] + basis.f[0] * spikeLen,
      pos[1] + basis.f[1] * spikeLen + 0.12 * radius,
      pos[2] + basis.f[2] * spikeLen
    ];
    const ctrl1 = [pos[0] + basis.f[0] * spikeLen * 0.35, pos[1] + basis.f[1] * spikeLen * 0.35 + 0.05, pos[2] + basis.f[2] * spikeLen * 0.35];
    const ctrl2 = [pos[0] + basis.f[0] * spikeLen * 0.75, pos[1] + basis.f[1] * spikeLen * 0.75 + 0.10, pos[2] + basis.f[2] * spikeLen * 0.75];
    stems.addBezier(pos, ctrl1, ctrl2, tip, 7, leafCol.base, leafCol.tip, 1, 0.14, 0.44, mesh.nextPartId());

    const floretCount = 16;
    const goldenAngle = 2.399963229728653;
    for (let i = 0; i < floretCount; i++) {
      const t = 0.25 + (i / (floretCount - 1)) * 0.74;
      const pt = evalBezier(pos, ctrl1, ctrl2, tip, t);
      const scale = (1.0 - (t - 0.25) * 0.65) * radius * 0.34;
      const ang = i * goldenAngle;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const outDir = normalize3(
        basis.r[0] * ca * 0.85 + basis.u[0] * sa * 0.85 + basis.f[0] * 0.45,
        basis.r[1] * ca * 0.85 + basis.u[1] * sa * 0.85 + basis.f[1] * 0.45,
        basis.r[2] * ca * 0.85 + basis.u[2] * sa * 0.85 + basis.f[2] * 0.45
      );
      const fb = buildBasis(outDir[0], outDir[1], outDir[2]);
      const partId = mesh.nextPartId();

      mesh.addParametricPatch(
        4, 3,
        (uu, v) => {
          const a = uu * Math.PI * 2;
          const rFl = scale * (0.18 + 0.68 * Math.sin(v * Math.PI * 0.72));
          const fwd = v * scale * 1.15;
          return [
            pt[0] + fb.f[0] * fwd + (fb.r[0] * Math.cos(a) + fb.u[0] * Math.sin(a)) * rFl,
            pt[1] + fb.f[1] * fwd + (fb.r[1] * Math.cos(a) + fb.u[1] * Math.sin(a)) * rFl,
            pt[2] + fb.f[2] * fwd + (fb.r[2] * Math.cos(a) + fb.u[2] * Math.sin(a)) * rFl
          ];
        },
        (uu, v) => lerp3(colors.inner, colors.edge, v),
        (uu, v) => 0.48 + 0.52 * v,
        (uu, v) => v > 0.7 ? 0.5 : 0.0,
        () => 0.20 + 0.25 * t,
        2, FLAG_DOUBLE_SIDED | FLAG_EMISSIVE_TIP, 12, 0.25, partId
      );
    }
  }

  function addPawBudMesh(mesh, pos, dir, len, colors, sway) {
    const basis = buildBasis(dir[0], dir[1], dir[2]);
    const partId = mesh.nextPartId();
    mesh.addParametricPatch(
      4, 4,
      (uu, v) => {
        const a = uu * Math.PI * 2;
        const curve = Math.pow(v, 1.7) * len * 0.28;
        const rad = len * (0.15 + 0.11 * Math.sin(v * Math.PI) - 0.09 * v);
        const cx = pos[0] + basis.f[0] * (v * len) + basis.u[0] * curve;
        const cy = pos[1] + basis.f[1] * (v * len) + basis.u[1] * curve;
        const cz = pos[2] + basis.f[2] * (v * len) + basis.u[2] * curve;
        const nx = basis.r[0] * Math.cos(a) + basis.u[0] * Math.sin(a);
        const ny = basis.r[1] * Math.cos(a) + basis.u[1] * Math.sin(a);
        const nz = basis.r[2] * Math.cos(a) + basis.u[2] * Math.sin(a);
        return [cx + nx * rad, cy + ny * rad, cz + nz * rad];
      },
      (uu, v) => v < 0.5
        ? lerp3(colors.inner, colors.mid, v * 2)
        : lerp3(colors.mid, colors.edge, (v - 0.5) * 2),
      (uu, v) => 0.65 + 0.35 * v,
      (uu, v) => v > 0.7 ? 0.5 : 0.0,
      () => sway,
      6, FLAG_EMISSIVE_TIP, 10, 0.20, partId
    );
  }

  function addKangarooPawBranch(mesh, stems, start, mainDir, length, colors) {
    const basis = buildBasis(mainDir[0], mainDir[1], mainDir[2]);
    const stalkDark = [110, 42, 20];
    const stalkTip = colors.mid;
    const endPt = [
      start[0] + basis.f[0] * length,
      start[1] + basis.f[1] * length + 0.12,
      start[2] + basis.f[2] * length
    ];
    const ctrl1 = [start[0] + basis.f[0] * length * 0.35, start[1] + basis.f[1] * length * 0.35 + 0.08, start[2] + basis.f[2] * length * 0.35];
    const ctrl2 = [start[0] + basis.f[0] * length * 0.72 + basis.u[0] * 0.10, start[1] + basis.f[1] * length * 0.72 + 0.14, start[2] + basis.f[2] * length * 0.72 + basis.u[2] * 0.10];
    stems.addBezier(start, ctrl1, ctrl2, endPt, 7, stalkDark, stalkTip, 2, 0.12, 0.44, mesh.nextPartId());

    addPawBudMesh(mesh, endPt, mainDir, 0.14, colors, 0.46);
    const forkTs = [0.46, 0.66, 0.82];
    for (let b = 0; b < 3; b++) {
      const anchor = evalBezier(start, ctrl1, ctrl2, endPt, forkTs[b]);
      const sideSign = b % 2 === 0 ? 1 : -1;
      const subDir = normalize3(
        basis.f[0] * 0.68 + basis.r[0] * sideSign * 0.58 + basis.u[0] * 0.24,
        basis.f[1] * 0.68 + basis.r[1] * sideSign * 0.58 + basis.u[1] * 0.24 + 0.18,
        basis.f[2] * 0.68 + basis.r[2] * sideSign * 0.58 + basis.u[2] * 0.24
      );
      const subLen = length * (0.34 - b * 0.04);
      const subEnd = [anchor[0] + subDir[0] * subLen, anchor[1] + subDir[1] * subLen + 0.05, anchor[2] + subDir[2] * subLen];
      stems.addSegment(anchor, subEnd, stalkTip, colors.edge, 1, 0.26 + b * 0.06, 0.48, mesh.nextPartId(), 0);
      addPawBudMesh(mesh, subEnd, subDir, 0.125, colors, 0.48);
    }
  }

  function addHypericumSprig(mesh, stems, pos, dir, berryCol, leafCol, rng) {
    const basis = buildBasis(dir[0], dir[1], dir[2]);
    const goldenAngle = 2.399963229728653;
    const berryCount = 6;
    const twigStart = [pos[0] - basis.f[0] * 0.14, pos[1] - basis.f[1] * 0.14, pos[2] - basis.f[2] * 0.14];

    for (let b = 0; b < berryCount; b++) {
      const t = b / berryCount;
      const ang = b * goldenAngle;
      const spread = 0.05 + 0.11 * Math.sqrt(t);
      const bx = pos[0] + (basis.r[0] * Math.cos(ang) + basis.u[0] * Math.sin(ang)) * spread + basis.f[0] * (0.04 * (1 - t));
      const by = pos[1] + (basis.r[1] * Math.cos(ang) + basis.u[1] * Math.sin(ang)) * spread + basis.f[1] * (0.04 * (1 - t));
      const bz = pos[2] + (basis.r[2] * Math.cos(ang) + basis.u[2] * Math.sin(ang)) * spread + basis.f[2] * (0.04 * (1 - t));
      const rBerry = 0.056 + 0.010 * rng();

      stems.addSegment(twigStart, [bx, by, bz], leafCol.base, leafCol.tip, 1, 0.12, 0.18, mesh.nextPartId(), 0);
      const bPart = mesh.nextPartId();
      mesh.addParametricPatch(
        5, 4,
        (uu, v) => {
          const theta = uu * Math.PI * 2;
          const phi = v * Math.PI;
          const sp = Math.sin(phi);
          return [
            bx + sp * Math.cos(theta) * rBerry,
            by + Math.cos(phi) * rBerry,
            bz + sp * Math.sin(theta) * rBerry
          ];
        },
        (uu, v) => v > 0.85 ? leafCol.base : lerp3(berryCol.edge, berryCol.inner, v),
        (uu, v) => 0.72 + 0.28 * (1 - v),
        (uu, v) => v < 0.35 ? 0.35 : 0.0,
        () => 0.18,
        4, 0, 32, 0.96, bPart
      );
    }
  }

  function addLeaf(mesh, pos, dir, length, width, leafCol, isEucalyptus = false) {
    const basis = buildBasis(dir[0], dir[1], dir[2]);
    const colBase = isEucalyptus ? [88, 138, 106] : leafCol.base;
    const colTip = isEucalyptus ? [148, 196, 162] : leafCol.tip;
    const partId = mesh.nextPartId();

    mesh.addParametricPatch(
      3, 5,
      (uu, v) => {
        const u = uu * 2 - 1;
        const shape = isEucalyptus
          ? Math.sin(Math.pow(v, 0.70) * Math.PI)
          : Math.sin(Math.pow(v, 0.56) * Math.PI);
        const w = u * width * 0.5 * shape;
        const arch = -0.20 * length * Math.pow(v, 1.8) + Math.abs(u) * 0.045 * width;
        const fwd = v * length;
        return [
          pos[0] + basis.r[0] * w + basis.u[0] * arch + basis.f[0] * fwd,
          pos[1] + basis.r[1] * w + basis.u[1] * arch + basis.f[1] * fwd,
          pos[2] + basis.r[2] * w + basis.u[2] * arch + basis.f[2] * fwd
        ];
      },
      (uu, v) => {
        const u = uu * 2 - 1;
        let c = lerp3(colBase, colTip, clamp(v * 0.85 + 0.15, 0, 1));
        if (Math.abs(u) < 0.16) c = lerp3(c, colTip, 0.28);
        return c;
      },
      (uu, v) => 0.48 + 0.52 * Math.pow(v, 0.5),
      (uu, v) => (Math.abs(uu - 0.5) > 0.36 || v > 0.80) ? 0.35 : 0.0,
      (uu, v) => 0.12 + 0.24 * v,
      3, FLAG_DOUBLE_SIDED, isEucalyptus ? 6 : 20, isEucalyptus ? 0.14 : 0.42, partId
    );
  }

  function addEucalyptusSprig(mesh, stems, start, dir, length, leafCol) {
    const basis = buildBasis(dir[0], dir[1], dir[2]);
    const end = [start[0] + basis.f[0] * length, start[1] + basis.f[1] * length + 0.08, start[2] + basis.f[2] * length];
    const c1 = [start[0] + basis.f[0] * length * 0.35, start[1] + basis.f[1] * length * 0.35 + 0.06, start[2] + basis.f[2] * length * 0.35];
    const c2 = [start[0] + basis.f[0] * length * 0.72, start[1] + basis.f[1] * length * 0.72 + 0.10, start[2] + basis.f[2] * length * 0.72];
    stems.addBezier(start, c1, c2, end, 6, [76, 118, 88], [118, 164, 132], 1, 0.12, 0.38, mesh.nextPartId());

    for (let i = 0; i < 4; i++) {
      const t = 0.25 + i * 0.22;
      const pt = evalBezier(start, c1, c2, end, t);
      const scale = 1 - i * 0.14;
      for (const side of [-1, 1]) {
        const lDir = normalize3(
          basis.r[0] * side * 0.72 + basis.f[0] * 0.46 + basis.u[0] * 0.22,
          basis.r[1] * side * 0.72 + basis.f[1] * 0.46 + basis.u[1] * 0.22 + 0.12,
          basis.r[2] * side * 0.72 + basis.f[2] * 0.46 + basis.u[2] * 0.22
        );
        addLeaf(mesh, pt, lDir, 0.21 * scale, 0.15 * scale, leafCol, true);
      }
    }
  }

  function addFernFrond(mesh, stems, start, dir, length, leafCol) {
    const basis = buildBasis(dir[0], dir[1], dir[2]);
    const end = [start[0] + basis.f[0] * length, start[1] + basis.f[1] * length - 0.14, start[2] + basis.f[2] * length];
    const c1 = [start[0] + basis.f[0] * length * 0.35, start[1] + basis.f[1] * length * 0.35 + 0.14, start[2] + basis.f[2] * length * 0.35];
    const c2 = [start[0] + basis.f[0] * length * 0.72, start[1] + basis.f[1] * length * 0.72 + 0.04, start[2] + basis.f[2] * length * 0.72];
    stems.addBezier(start, c1, ctrl2Vec(c2), end, 8, leafCol.base, leafCol.tip, 1, 0.14, 0.42, mesh.nextPartId());

    for (let i = 0; i < 9; i++) {
      const t = 0.20 + i * 0.092;
      const pt = evalBezier(start, c1, c2, end, t);
      const pinnaLen = (1 - Math.abs(t - 0.48) * 1.4) * 0.17;
      if (pinnaLen <= 0.03) continue;
      for (const side of [-1, 1]) {
        const lDir = normalize3(
          basis.r[0] * side * 0.85 + basis.f[0] * 0.42,
          basis.r[1] * side * 0.85 + basis.f[1] * 0.42 + 0.1,
          basis.r[2] * side * 0.85 + basis.f[2] * 0.42
        );
        addLeaf(mesh, pt, lDir, pinnaLen, 0.055, leafCol, false);
      }
    }
  }

  function ctrl2Vec(v) {
    return [v[0], v[1], v[2]];
  }

  function addRibbonBow(mesh, waistY, waistRadius, ribTheme) {
    const { dark: ribDark, mid: ribMid, lit: ribLit } = ribTheme;

    const bandId = mesh.nextPartId();
    mesh.addParametricPatch(
      22, 3,
      (u, v) => {
        const theta = u * Math.PI * 2;
        const y = lerp(waistY - 0.08, waistY + 0.08, v);
        const r = waistRadius + 0.012 * Math.sin(v * Math.PI);
        return [r * Math.sin(theta), y, r * Math.cos(theta)];
      },
      (u, v) => lerp3(ribMid, ribLit, Math.sin(v * Math.PI) * 0.7),
      (u, v) => 0.72 + 0.28 * Math.sin(v * Math.PI),
      () => 0.25,
      () => 0.05,
      5, FLAG_DOUBLE_SIDED, 26, 0.80, bandId
    );

    const knotPos = [-0.04, waistY, waistRadius + 0.025];
    const knotId = mesh.nextPartId();
    mesh.addParametricPatch(
      7, 4,
      (u, v) => {
        const a = u * Math.PI * 2;
        const b = (v - 0.5) * Math.PI;
        return [
          knotPos[0] + Math.cos(b) * Math.cos(a) * 0.052,
          knotPos[1] + Math.sin(b) * 0.042,
          knotPos[2] + Math.cos(b) * Math.sin(a) * 0.042
        ];
      },
      () => ribLit,
      () => 0.92,
      () => 0.4,
      () => 0.06,
      5, 0, 28, 0.85, knotId
    );

    for (const side of [-1, 1]) {
      const loopId = mesh.nextPartId();
      mesh.addParametricPatch(
        9, 4,
        (u, v) => {
          const t = u * Math.PI * 2;
          const w = (v - 0.5) * 0.075;
          const lx = side * (0.04 + 0.16 * Math.sin(t * 0.5));
          const ly = 0.065 * Math.sin(t) + w * 0.65;
          const lz = 0.055 * Math.sin(t * 0.5) + w * 0.35;
          return [knotPos[0] + lx, knotPos[1] + ly, knotPos[2] + lz];
        },
        (u, v) => lerp3(ribDark, ribLit, 0.35 + 0.65 * Math.sin(v * Math.PI)),
        () => 0.88,
        () => 0.35,
        () => 0.12,
        5, FLAG_DOUBLE_SIDED, 26, 0.82, loopId
      );
    }

    const tails = [
      { xOff: -0.05, driftX: -0.24, driftZ: 0.20, phase: 0.5 },
      { xOff: 0.04, driftX: 0.18, driftZ: 0.24, phase: 1.8 }
    ];
    for (const ts of tails) {
      const tailId = mesh.nextPartId();
      mesh.addParametricPatch(
        3, 14,
        (u, v) => {
          const w = (u - 0.5) * 0.065;
          const y = lerp(waistY - 0.02, -1.68, v);
          const x = knotPos[0] + ts.xOff + ts.driftX * Math.pow(v, 0.85) + 0.03 * Math.sin(v * 5.0 + ts.phase) + w;
          const z = knotPos[2] + ts.driftZ * Math.pow(v, 0.72) + 0.025 * Math.cos(v * 4.2 + ts.phase);
          return [x, y, z];
        },
        (u, v) => lerp3(ribMid, ribLit, 0.38 + 0.55 * Math.sin(v * Math.PI * 2 + ts.phase)),
        (u, v) => 0.68 + 0.32 * v,
        (u, v) => v > 0.88 ? 0.45 : 0.15,
        (u, v) => 0.08 + 0.44 * v,
        5, FLAG_DOUBLE_SIDED, 26, 0.82, tailId
      );
    }
  }

  function addContourVeil(mesh, stems, waistY, ribTheme) {
    const colRim = lerp3(ribTheme.lit, [255, 232, 238], 0.62);
    const colDim = lerp3(ribTheme.dark, [156, 128, 142], 0.55);

    const ribCount = 8;
    for (let i = 0; i < ribCount; i++) {
      const a = (i / ribCount) * Math.PI * 2 + 0.2;
      const pTop = [Math.sin(a) * 0.23, waistY, Math.cos(a) * 0.23];
      const pBot = [Math.sin(a) * 0.68, -1.76, Math.cos(a) * 0.68];
      stems.addSegment(pTop, pBot, colRim, colDim, 1, 0.04, 0.14, mesh.nextPartId(), 0, 58);
    }

    const arcs = [
      { t0: -2.55, t1: -0.95, yPeak: 1.48, rTop: 1.48 },
      { t0: 0.95,  t1: 2.55,  yPeak: 1.42, rTop: 1.46 },
      { t0: 2.35,  t1: 3.92,  yPeak: 1.72, rTop: 1.24 },
      { t0: -1.05, t1: 1.05,  yPeak: -0.26, rTop: 1.08 }
    ];
    for (const arc of arcs) {
      const partId = mesh.nextPartId();
      const segs = 14;
      let prev = null;
      for (let i = 0; i <= segs; i++) {
        const u = i / segs;
        const th = lerp(arc.t0, arc.t1, u);
        const peak = 1 - Math.pow(Math.abs(u - 0.5) * 2, 1.45);
        const y = lerp(arc.yPeak - 0.55, arc.yPeak, peak);
        const r = arc.rTop * (0.86 + 0.14 * peak);
        const pt = [r * Math.sin(th), y, r * Math.cos(th)];
        if (prev) {
          stems.addSegment(prev, pt, colRim, colRim, 1, 0.16, 0.16, partId, 0, 46);
        }
        prev = pt;
      }

      const pL = [arc.rTop * 0.86 * Math.sin(arc.t0), arc.yPeak - 0.55, arc.rTop * 0.86 * Math.cos(arc.t0)];
      const pR = [arc.rTop * 0.86 * Math.sin(arc.t1), arc.yPeak - 0.55, arc.rTop * 0.86 * Math.cos(arc.t1)];
      const wL = [0.22 * Math.sin(arc.t0), waistY, 0.22 * Math.cos(arc.t0)];
      const wR = [0.22 * Math.sin(arc.t1), waistY, 0.22 * Math.cos(arc.t1)];
      stems.addSegment(wL, pL, colDim, colRim, 1, 0.05, 0.14, partId, 0, 58);
      stems.addSegment(wR, pR, colDim, colRim, 1, 0.05, 0.14, partId, 0, 58);
    }
  }

  function layoutBlooms(cfg, rng) {
    const count = cfg.bloomCount;
    const activeIds = cfg.species.length > 0 ? cfg.species : ['rose'];
    const metaMap = Object.create(null);
    for (const s of SPECIES_LIST) metaMap[s.id] = s;

    const chosen = [];
    for (let i = 0; i < count; i++) {
      chosen.push(activeIds[i % activeIds.length]);
    }
    for (let i = chosen.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      const tmp = chosen[i];
      chosen[i] = chosen[j];
      chosen[j] = tmp;
    }

    const sizeScale = clamp(Math.sqrt(13 / count), 0.76, 1.24);
    const goldenAngle = 2.399963229728653;
    const blooms = [];

    for (let i = 0; i < count; i++) {
      const spId = chosen[i];
      const meta = metaMap[spId] || metaMap.rose;
      const t = count > 1 ? i / (count - 1) : 0.5;
      const az = i * goldenAngle + (rng() - 0.5) * 0.32;

      let yMin = 0.18, yMax = 1.38, rMin = 0.28, rMax = 1.02;
      if (cfg.shape === 'airy') {
        yMin = 0.10; yMax = 1.56; rMin = 0.34; rMax = 1.15;
      } else if (cfg.shape === 'round') {
        yMin = 0.24; yMax = 1.24; rMin = 0.26; rMax = 0.86;
      } else if (cfg.shape === 'asymmetric') {
        yMin = 0.06; yMax = 1.52; rMin = 0.32; rMax = 1.08;
      }

      let tierT = t;
      if (meta.tier === 'hero') tierT = t * 0.72;
      else if (meta.tier === 'accent') tierT = 0.35 + t * 0.65;

      let y = lerp(yMax, yMin, Math.pow(tierT, 0.78)) + (rng() - 0.5) * 0.18;
      if (cfg.shape === 'asymmetric') {
        y += Math.sin(az) * 0.28;
      }
      const horizR = lerp(rMin, rMax, Math.sqrt(tierT)) * (0.88 + 0.24 * rng());
      const x = Math.cos(az) * horizR;
      const z = Math.sin(az) * horizR;
      const rad = meta.baseR * sizeScale * (0.90 + 0.18 * rng());

      blooms.push({ spId, x, y, z, r: rad, variantIdx: i });
    }

    for (let iter = 0; iter < 18; iter++) {
      for (let i = 0; i < count; i++) {
        for (let j = i + 1; j < count; j++) {
          const a = blooms[i];
          const b = blooms[j];
          const dx = a.x - b.x;
          const dy = a.y - b.y;
          const dz = a.z - b.z;
          const dist = Math.hypot(dx, dy, dz) || 0.001;
          const minDist = (a.r + b.r) * 0.88 + 0.09;
          if (dist < minDist) {
            const push = ((minDist - dist) / dist) * 0.36;
            a.x += dx * push; a.y += dy * push; a.z += dz * push;
            b.x -= dx * push; b.y -= dy * push; b.z -= dz * push;
          }
        }
      }

      const maxSpan = cfg.shape === 'airy' ? 1.24 : cfg.shape === 'round' ? 0.98 : 1.14;
      for (let i = 0; i < count; i++) {
        const b = blooms[i];
        const hr = Math.hypot(b.x, b.z);
        if (hr > maxSpan) {
          const s = maxSpan / hr;
          b.x *= s;
          b.z *= s;
        }
        b.y = clamp(b.y, 0.04, cfg.shape === 'round' ? 1.32 : 1.54);
      }
    }

    return blooms;
  }

  function generateBouquet(cfg) {
    const rng = mulberry32(cfg.seed);
    const pal = PALETTES[cfg.palette] || PALETTES.autumn;
    const mesh = new MeshBuilder();
    const stems = new StemList();
    const waistY = -0.82;

    const stemTopCol = pal.leaf.tip;
    const stemWaistCol = pal.leaf.base;
    const stemCutCol = lerp3(pal.leaf.base, pal.leaf.tip, 0.45);
    const dense = cfg.bloomCount > 16;

    function connectStem(pos, dir, thick = 2, backOff = 0.04) {
      const f = normalize3(dir[0], dir[1], dir[2]);
      const p0 = [pos[0] - f[0] * backOff, pos[1] - f[1] * backOff, pos[2] - f[2] * backOff];

      const radialLen = Math.hypot(p0[0], p0[2]) || 1;
      const wRad = Math.min(0.11, radialLen * 0.12);
      const wPt = [(p0[0] / radialLen) * wRad, waistY, (p0[2] / radialLen) * wRad];

      const cutY = -1.70 - rng() * 0.10;
      const pEnd = [-p0[0] * 0.24 + (rng() - 0.5) * 0.06, cutY, -p0[2] * 0.24 + (rng() - 0.5) * 0.06];
      const tWaist = normalize3(pEnd[0] - p0[0] * 0.35, -1.0, pEnd[2] - p0[2] * 0.35);

      const c1 = [p0[0] - f[0] * 0.26, p0[1] - f[1] * 0.26 - 0.16, p0[2] - f[2] * 0.26];
      const c2 = [wPt[0] - tWaist[0] * 0.36, wPt[1] - tWaist[1] * 0.36, wPt[2] - tWaist[2] * 0.36];
      stems.addBezier(p0, c1, c2, wPt, 8, stemTopCol, stemWaistCol, thick, 0.14, 0.05, mesh.nextPartId());

      const c1b = [wPt[0] + tWaist[0] * 0.26, wPt[1] + tWaist[1] * 0.26, wPt[2] + tWaist[2] * 0.26];
      const c2b = [pEnd[0] - tWaist[0] * 0.22, pEnd[1] - tWaist[1] * 0.22, pEnd[2] - tWaist[2] * 0.22];
      stems.addBezier(wPt, c1b, c2b, pEnd, 5, stemWaistCol, stemCutCol, thick, 0.05, 0.14, mesh.nextPartId());
    }

    const blooms = layoutBlooms(cfg, rng);
    const colCycle = [pal.primary, pal.secondary, pal.accent];

    for (let i = 0; i < blooms.length; i++) {
      const b = blooms[i];
      const pos = [b.x, b.y, b.z];
      const dir = normalize3(b.x, (b.y + 0.30) * 0.62 + 0.16, b.z);
      const colSet = colCycle[b.variantIdx % colCycle.length];

      switch (b.spId) {
        case 'rose':
          addRose(mesh, pos, dir, b.r, colSet, pal.leaf, rng, dense);
          connectStem(pos, dir, 2, b.r * 0.08);
          break;
        case 'rosebud':
          addRoseBud(mesh, pos, dir, b.r, colSet, pal.leaf);
          connectStem(pos, dir, 1, 0.02);
          break;
        case 'tulip':
          addTulip(mesh, pos, dir, b.r, colSet, pal.center);
          connectStem(pos, dir, 2, 0.02);
          break;
        case 'orchid':
          addCymbidiumOrchid(mesh, pos, dir, b.r, colSet, pal.center, pal.leaf);
          connectStem(pos, dir, 2, 0.04);
          break;
        case 'calla':
          addCallaLily(mesh, pos, dir, b.r, colSet, pal.center);
          connectStem(pos, dir, 2, 0.01);
          break;
        case 'daisy':
          addDaisy(mesh, pos, dir, b.r, colSet, pal.center);
          connectStem(pos, dir, 1, 0.03);
          break;
        case 'sunflower':
          addSunflower(mesh, pos, dir, b.r, colSet, pal.leaf);
          connectStem(pos, dir, 2, 0.04);
          break;
        case 'peony':
          addPeony(mesh, pos, dir, b.r, colSet, pal.center, pal.leaf, rng, dense);
          connectStem(pos, dir, 2, b.r * 0.06);
          break;
        case 'lily':
          addLily(mesh, stems, pos, dir, b.r, colSet, pal.center);
          connectStem(pos, dir, 2, 0.03);
          break;
        case 'protea':
          addPincushionProtea(mesh, stems, pos, dir, b.r, colSet, rng);
          connectStem(pos, dir, 2, b.r * 0.08);
          break;
        case 'spike': {
          const baseSpike = [b.x * 0.72, Math.max(0.05, b.y - 0.28), b.z * 0.72];
          addFlowerSpike(mesh, stems, baseSpike, dir, b.r, colSet, pal.leaf);
          connectStem(baseSpike, dir, 1, 0.0);
          break;
        }
        case 'accents':
          if (i % 2 === 0) {
            const kpStart = [b.x * 0.72, Math.max(0.0, b.y - 0.16), b.z * 0.72];
            addKangarooPawBranch(mesh, stems, kpStart, dir, 0.78, pal.accent);
            connectStem(kpStart, dir, 1, 0.0);
          } else {
            addHypericumSprig(mesh, stems, pos, dir, pal.secondary, pal.leaf, rng);
            connectStem(pos, dir, 1, 0.06);
          }
          break;
      }
    }

    const greenFactor = cfg.greenery / 100;
    const leafCount = Math.round(20 * greenFactor);
    for (let i = 0; i < leafCount; i++) {
      const a = (i / Math.max(1, leafCount)) * Math.PI * 2 + 0.22 * (i % 2);
      const tier = i % 3;
      const y = tier === 0 ? -0.18 : tier === 1 ? 0.16 : 0.46;
      const r = tier === 0 ? 0.52 : tier === 1 ? 0.62 : 0.50;
      const lx = r * Math.cos(a);
      const lz = r * Math.sin(a);
      const dir = normalize3(Math.cos(a) * 0.90, 0.22 + tier * 0.16, Math.sin(a) * 0.90);
      addLeaf(mesh, [lx, y, lz], dir, 0.36 + 0.08 * (i % 2), 0.18, pal.leaf, false);
      if (i % 2 === 0) {
        connectStem([lx, y, lz], dir, 1, 0.02);
      }
    }

    const sprigCount = Math.round(4 * greenFactor);
    for (let i = 0; i < sprigCount; i++) {
      const a = (i / Math.max(1, sprigCount)) * Math.PI * 2 + 0.45;
      const sx = 0.44 * Math.cos(a);
      const sz = 0.44 * Math.sin(a);
      const sy = 0.22 + (i % 2) * 0.28;
      const dir = normalize3(Math.cos(a) * 0.78, 0.52, Math.sin(a) * 0.78);
      if (cfg.shape === 'airy' && i % 2 === 1) {
        addFernFrond(mesh, stems, [sx, sy, sz], dir, 0.66, pal.leaf);
      } else {
        addEucalyptusSprig(mesh, stems, [sx, sy, sz], dir, 0.60, pal.leaf);
      }
      connectStem([sx, sy, sz], dir, 1, 0.0);
    }

    const ribKey = cfg.ribbon === 'auto' ? pal.ribbon : cfg.ribbon;
    const ribTheme = RIBBON_THEMES[ribKey] || RIBBON_THEMES.terracotta;
    if (cfg.ribbon !== 'none') {
      addRibbonBow(mesh, waistY, 0.165, ribTheme);
    }
    if (cfg.wrap === 'veil') {
      addContourVeil(mesh, stems, waistY, ribTheme);
    }

    const particles = [];
    const glyphs = ['.', '·', '°', 'o', '*', '~', '+'];
    for (let i = 0; i < 72; i++) {
      const a = rng() * Math.PI * 2;
      const r = 1.25 + rng() * 1.45;
      const y = -1.75 + rng() * 3.55;
      particles.push({
        x: r * Math.cos(a),
        y,
        z: r * Math.sin(a),
        glyph: glyphs[i % glyphs.length],
        col: pal.sparkles[i % pal.sparkles.length],
        phase: rng() * Math.PI * 2,
        speed: 0.4 + rng() * 0.9,
        orbit: (rng() - 0.5) * 0.22
      });
    }

    const sparkleAnchors = [
      [-1.66, 1.42, 0.35], [1.62, 1.38, -0.25], [-1.76, 0.16, -0.45], [1.74, -0.14, 0.40],
      [-1.26, -1.36, 0.55], [1.22, -1.30, -0.45], [0.88, 1.68, 0.48], [-0.94, 1.64, -0.42]
    ];
    const sparkles = sparkleAnchors.map((pt, idx) => ({
      x: pt[0], y: pt[1], z: pt[2],
      col: pal.sparkles[idx % pal.sparkles.length],
      phase: idx * 0.85
    }));

    return {
      mesh: mesh.pack(),
      stems: stems.segments,
      ambient: { particles, sparkles },
      bloomCount: blooms.length
    };
  }

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });
  const bloomCanvas = document.createElement('canvas');
  const bloomCtx = bloomCanvas.getContext('2d');

  const colorCache = new Array(32768);
  function getCachedColor(r, g, b) {
    const r5 = (clamp(r | 0, 0, 255) >> 3) & 31;
    const g5 = (clamp(g | 0, 0, 255) >> 3) & 31;
    const b5 = (clamp(b | 0, 0, 255) >> 3) & 31;
    const key = (r5 << 10) | (g5 << 5) | b5;
    let str = colorCache[key];
    if (!str) {
      const cr = (r5 << 3) | (r5 >> 2);
      const cg = (g5 << 3) | (g5 >> 2);
      const cb = (b5 << 3) | (b5 >> 2);
      str = 'rgb(' + cr + ',' + cg + ',' + cb + ')';
      colorCache[key] = str;
    }
    return str;
  }

  const cfg = {
    seed: 104821,
    preset: 'autumn',
    palette: 'autumn',
    species: ['rose', 'rosebud', 'orchid', 'calla', 'protea', 'accents'],
    shape: 'dome',
    bloomCount: 14,
    greenery: 65,
    ribbon: 'auto',
    wrap: 'none',
    caption: ''
  };

  const state = {
    playing: true,
    speedMul: 1.0,
    glow: true,
    edges: true,
    densityIdx: 0,
    densityLabels: ['Detailed', 'Ultra', 'Classic'],
    drawerCollapsed: window.innerWidth < 1020,
    hudHidden: false,
    angleY: 0.0,
    pitch: 0.24,
    zoom: 1.0,
    velY: 0.0,
    velP: 0.0,
    dragging: false,
    lastX: 0,
    lastY: 0,
    currentCenterX: window.innerWidth ? window.innerWidth * 0.5 : 640
  };

  let viewW = 1280, viewH = 720, dpr = 1;
  let cellH = 8, cellW = 5, cols = 200, rows = 108;

  let zBuf = new Float32Array(0);
  let rBuf = new Uint8Array(0);
  let gBuf = new Uint8Array(0);
  let bBuf = new Uint8Array(0);
  let lumBuf = new Float32Array(0);
  let rampBuf = new Uint8Array(0);
  let charBuf = new Uint16Array(0);
  let partBuf = new Uint16Array(0);

  let tvGx = new Float32Array(0);
  let tvGy = new Float32Array(0);
  let tvZ = new Float32Array(0);
  let tvNx = new Float32Array(0);
  let tvNy = new Float32Array(0);
  let tvNz = new Float32Array(0);

  let activeBouquet = null;

  function regenerateBouquet() {
    activeBouquet = generateBouquet(cfg);
    const vc = activeBouquet.mesh.vCount;
    if (vc > tvGx.length) {
      tvGx = new Float32Array(vc);
      tvGy = new Float32Array(vc);
      tvZ = new Float32Array(vc);
      tvNx = new Float32Array(vc);
      tvNy = new Float32Array(vc);
      tvNz = new Float32Array(vc);
    }
    updateStatsReadout();
    saveHashQuiet();
  }

  function resize() {
    viewW = window.innerWidth || 1280;
    viewH = window.innerHeight || 720;
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.max(1, Math.floor(viewW * dpr));
    canvas.height = Math.max(1, Math.floor(viewH * dpr));
    canvas.style.width = viewW + 'px';
    canvas.style.height = viewH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (state.densityIdx === 0) {
      cellH = clamp(Math.floor(viewH / 108), 7, 10);
    } else if (state.densityIdx === 1) {
      cellH = clamp(Math.floor(viewH / 142), 5, 8);
    } else {
      cellH = clamp(Math.floor(viewH / 76), 9, 13);
    }

    ctx.font = cellH + 'px "JetBrains Mono", "Cascadia Mono", "Fira Code", Consolas, "Courier New", monospace';
    ctx.textBaseline = 'top';
    cellW = Math.max(3.2, ctx.measureText('M').width * 1.02);

    cols = Math.ceil(viewW / cellW);
    rows = Math.ceil(viewH / cellH);

    const total = cols * rows;
    zBuf = new Float32Array(total);
    rBuf = new Uint8Array(total);
    gBuf = new Uint8Array(total);
    bBuf = new Uint8Array(total);
    lumBuf = new Float32Array(total);
    rampBuf = new Uint8Array(total);
    charBuf = new Uint16Array(total);
    partBuf = new Uint16Array(total);

    bloomCanvas.width = Math.max(1, viewW >> 2);
    bloomCanvas.height = Math.max(1, viewH >> 2);
    updateStatsReadout();
  }

  const L1 = normalize3(-0.42, 0.68, 0.60);
  const L2 = normalize3(0.62, 0.28, -0.73);
  const H1 = normalize3(L1[0], L1[1], L1[2] + 1.0);

  function rasterizeTriangles(mesh, cosY, sinY, cosP, sinP, centerX, centerY, projScale, camDist, t) {
    const vc = mesh.vCount;
    const vxArr = mesh.vx, vyArr = mesh.vy, vzArr = mesh.vz;
    const vnxArr = mesh.vnx, vnyArr = mesh.vny, vnzArr = mesh.vnz;
    const swayArr = mesh.vsway;
    const invCellW = 1 / cellW;
    const invCellH = 1 / cellH;

    for (let i = 0; i < vc; i++) {
      let x = vxArr[i];
      const y = vyArr[i];
      let z = vzArr[i];
      const sw = swayArr[i];
      if (sw > 0.01) {
        const wave = Math.sin(t * 1.85 + x * 1.6 + y * 1.2) * 0.020 * sw;
        x += wave;
        z += wave * 0.7;
      }

      const x1 = x * cosY + z * sinY;
      const z1 = -x * sinY + z * cosY;
      const y2 = y * cosP - z1 * sinP;
      const z2 = y * sinP + z1 * cosP;

      const dz = camDist - z2;
      if (dz < 0.8) {
        tvZ[i] = -1e9;
        continue;
      }

      const scale = projScale / dz;
      tvGx[i] = (centerX + x1 * scale) * invCellW;
      tvGy[i] = (centerY - (y2 + 0.04) * scale) * invCellH;
      tvZ[i] = z2;

      const nx0 = vnxArr[i], ny0 = vnyArr[i], nz0 = vnzArr[i];
      const nx1 = nx0 * cosY + nz0 * sinY;
      const nz1 = -nx0 * sinY + nz0 * cosY;
      tvNx[i] = nx1;
      tvNy[i] = ny0 * cosP - nz1 * sinP;
      tvNz[i] = ny0 * sinP + nz1 * cosP;
    }

    const tc = mesh.tCount;
    const ti0Arr = mesh.ti0, ti1Arr = mesh.ti1, ti2Arr = mesh.ti2;
    const tRampArr = mesh.tRamp, tFlagsArr = mesh.tFlags;
    const tSpecPowArr = mesh.tSpecPow, tSpecStrArr = mesh.tSpecStr, tPartArr = mesh.tPart;
    const vcr = mesh.vcr, vcg = mesh.vcg, vcb = mesh.vcb;
    const vao = mesh.vao, vrim = mesh.vrim;

    const l1x = L1[0], l1y = L1[1], l1z = L1[2];
    const l2x = L2[0], l2y = L2[1], l2z = L2[2];
    const h1x = H1[0], h1y = H1[1], h1z = H1[2];

    for (let tr = 0; tr < tc; tr++) {
      const i0 = ti0Arr[tr];
      const i1 = ti1Arr[tr];
      const i2 = ti2Arr[tr];

      const z0 = tvZ[i0], z1 = tvZ[i1], z2 = tvZ[i2];
      if (z0 < -1e8 || z1 < -1e8 || z2 < -1e8) continue;

      const x0 = tvGx[i0], y0 = tvGy[i0];
      const x1 = tvGx[i1], y1 = tvGy[i1];
      const x2 = tvGx[i2], y2 = tvGy[i2];

      const area = (x1 - x0) * (y2 - y0) - (x2 - x0) * (y1 - y0);
      if (Math.abs(area) < 1e-4) continue;
      const invArea = 1 / area;

      let minC = Math.floor(Math.min(x0, x1, x2));
      let maxC = Math.ceil(Math.max(x0, x1, x2));
      let minR = Math.floor(Math.min(y0, y1, y2));
      let maxR = Math.ceil(Math.max(y0, y1, y2));

      if (maxC < 0 || minC >= cols || maxR < 0 || minR >= rows) continue;
      if (minC < 0) minC = 0;
      if (maxC >= cols) maxC = cols - 1;
      if (minR < 0) minR = 0;
      if (maxR >= rows) maxR = rows - 1;

      const ramp = tRampArr[tr];
      const fl = tFlagsArr[tr];
      const doubleSided = (fl & FLAG_DOUBLE_SIDED) !== 0;
      const emissiveTip = (fl & FLAG_EMISSIVE_TIP) !== 0;
      const sPow = tSpecPowArr[tr];
      const sStr = tSpecStrArr[tr] / 255;
      const partId = tPartArr[tr];

      for (let row = minR; row <= maxR; row++) {
        const py = row + 0.5;
        const rowOff = row * cols;
        for (let col = minC; col <= maxC; col++) {
          const px = col + 0.5;
          const w0 = ((x1 - px) * (y2 - py) - (x2 - px) * (y1 - py)) * invArea;
          const w1 = ((x2 - px) * (y0 - py) - (x0 - px) * (y2 - py)) * invArea;
          const w2 = ((x0 - px) * (y1 - py) - (x1 - px) * (y0 - py)) * invArea;
          if (w0 < -0.025 || w1 < -0.025 || w2 < -0.025) continue;

          const cw0 = w0 < 0 ? 0 : w0;
          const cw1 = w1 < 0 ? 0 : w1;
          const cw2 = w2 < 0 ? 0 : w2;
          const wSum = cw0 + cw1 + cw2 || 1;
          const a0 = cw0 / wSum;
          const a1 = cw1 / wSum;
          const a2 = cw2 / wSum;

          const z = a0 * z0 + a1 * z1 + a2 * z2;
          const cell = rowOff + col;
          if (z <= zBuf[cell]) continue;

          zBuf[cell] = z;
          partBuf[cell] = partId;
          rampBuf[cell] = ramp;

          let nx = a0 * tvNx[i0] + a1 * tvNx[i1] + a2 * tvNx[i2];
          let ny = a0 * tvNy[i0] + a1 * tvNy[i1] + a2 * tvNy[i2];
          let nz = a0 * tvNz[i0] + a1 * tvNz[i1] + a2 * tvNz[i2];
          const nLen = Math.hypot(nx, ny, nz) || 1;
          nx /= nLen; ny /= nLen; nz /= nLen;

          if (doubleSided && nz < 0) {
            nx = -nx; ny = -ny; nz = -nz;
          }

          const d1 = nx * l1x + ny * l1y + nz * l1z;
          const d2 = nx * l2x + ny * l2y + nz * l2z;
          const diff1 = d1 > 0 ? d1 * 0.72 : 0;
          const diff2 = d2 > 0 ? d2 * 0.24 : 0;
          const fres = nz > 0 ? Math.pow(1 - nz, 2.1) * 0.32 : 0.32;

          const ndh = nx * h1x + ny * h1y + nz * h1z;
          const spec = ndh > 0 ? Math.pow(ndh, sPow) * sStr : 0;

          const ao = a0 * vao[i0] + a1 * vao[i1] + a2 * vao[i2];
          const rim = a0 * vrim[i0] + a1 * vrim[i1] + a2 * vrim[i2];
          const floor = emissiveTip ? 0.34 : 0.24;
          const depthFade = clamp(0.84 + z * 0.12, 0.70, 1.08);
          const lum = clamp((floor + diff1 + diff2 + fres + spec * 0.55 + rim * 0.14) * (0.28 + 0.72 * ao) * depthFade, 0.08, 1.0);

          const cr = a0 * vcr[i0] + a1 * vcr[i1] + a2 * vcr[i2];
          const cg = a0 * vcg[i0] + a1 * vcg[i1] + a2 * vcg[i2];
          const cb = a0 * vcb[i0] + a1 * vcb[i1] + a2 * vcb[i2];

          const brightScale = 0.42 + 0.66 * Math.pow(lum, 0.85);
          const hiBlend = spec > 0.16 ? Math.min(0.60, spec * 0.85) : 0;

          rBuf[cell] = clamp(Math.round(cr * brightScale * (1 - hiBlend) + 255 * hiBlend), 0, 255);
          gBuf[cell] = clamp(Math.round(cg * brightScale * (1 - hiBlend) + 244 * hiBlend), 0, 255);
          bBuf[cell] = clamp(Math.round(cb * brightScale * (1 - hiBlend) + 226 * hiBlend), 0, 255);
          lumBuf[cell] = lum;
        }
      }
    }
  }

  function drawStemLines(stemSegs, cosY, sinY, cosP, sinP, centerX, centerY, projScale, camDist, t) {
    const invCellW = 1 / cellW;
    const invCellH = 1 / cellH;

    for (let s = 0; s < stemSegs.length; s++) {
      const seg = stemSegs[s];
      let x0 = seg.x0, y0 = seg.y0, z0 = seg.z0;
      let x1 = seg.x1, y1 = seg.y1, z1 = seg.z1;

      if (seg.sway0 > 0.01) {
        const w0 = Math.sin(t * 1.85 + x0 * 1.6 + y0 * 1.2) * 0.020 * seg.sway0;
        x0 += w0; z0 += w0 * 0.7;
      }
      if (seg.sway1 > 0.01) {
        const w1 = Math.sin(t * 1.85 + x1 * 1.6 + y1 * 1.2) * 0.020 * seg.sway1;
        x1 += w1; z1 += w1 * 0.7;
      }

      const rx0 = x0 * cosY + z0 * sinY;
      const rz0 = -x0 * sinY + z0 * cosY;
      const py0 = y0 * cosP - rz0 * sinP;
      const pz0 = y0 * sinP + rz0 * cosP;

      const rx1 = x1 * cosY + z1 * sinY;
      const rz1 = -x1 * sinY + z1 * cosY;
      const py1 = y1 * cosP - rz1 * sinP;
      const pz1 = y1 * sinP + rz1 * cosP;

      const dz0 = camDist - pz0;
      const dz1 = camDist - pz1;
      if (dz0 < 0.8 || dz1 < 0.8) continue;

      const sc0 = projScale / dz0;
      const sc1 = projScale / dz1;
      const gx0 = (centerX + rx0 * sc0) * invCellW;
      const gy0 = (centerY - (py0 + 0.04) * sc0) * invCellH;
      const gx1 = (centerX + rx1 * sc1) * invCellW;
      const gy1 = (centerY - (py1 + 0.04) * sc1) * invCellH;

      let slopeCode;
      if (seg.bodyGlyph) {
        slopeCode = seg.bodyGlyph;
      } else {
        const dxPx = (gx1 - gx0) * cellW;
        const dyPx = (gy1 - gy0) * cellH;
        const ang = Math.atan2(dyPx, dxPx);
        const absSin = Math.abs(Math.sin(ang));
        if (absSin > 0.84) slopeCode = 124;
        else if (absSin < 0.34) slopeCode = 45;
        else slopeCode = (dxPx * dyPx) < 0 ? 47 : 92;
      }

      const steps = Math.max(2, Math.ceil(Math.hypot(gx1 - gx0, gy1 - gy0) * 1.8));
      const thick = seg.thick;

      for (let k = 0; k <= steps; k++) {
        const f = k / steps;
        const cx = (lerp(gx0, gx1, f)) | 0;
        const cy = (lerp(gy0, gy1, f)) | 0;
        const z = lerp(pz0, pz1, f);
        const depthFade = clamp(0.84 + z * 0.12, 0.65, 1.05);

        const r = clamp(Math.round(lerp(seg.r0, seg.r1, f) * depthFade), 0, 255);
        const g = clamp(Math.round(lerp(seg.g0, seg.g1, f) * depthFade), 0, 255);
        const b = clamp(Math.round(lerp(seg.b0, seg.b1, f) * depthFade), 0, 255);
        const code = (seg.tipGlyph && k >= steps - 1) ? seg.tipGlyph : slopeCode;

        for (let ox = 0; ox < thick; ox++) {
          const px = cx + ox;
          if (px < 0 || px >= cols || cy < 0 || cy >= rows) continue;
          const cell = cy * cols + px;
          if (z > zBuf[cell]) {
            zBuf[cell] = z;
            rBuf[cell] = r;
            gBuf[cell] = g;
            bBuf[cell] = b;
            lumBuf[cell] = 0.72;
            rampBuf[cell] = 255;
            charBuf[cell] = code;
            partBuf[cell] = seg.partId;
          }
        }
      }
    }
  }

  function applyContourPass() {
    for (let row = 1; row < rows - 1; row++) {
      const rowOff = row * cols;
      for (let col = 1; col < cols - 1; col++) {
        const cell = rowOff + col;
        const part = partBuf[cell];
        if (part === 0 || rampBuf[cell] === 255) continue;

        const z = zBuf[cell];
        let frontEdge = false;
        let behindEdge = false;

        const nIdx = [cell - 1, cell + 1, cell - cols, cell + cols];
        for (let k = 0; k < 4; k++) {
          const nb = nIdx[k];
          const nbPart = partBuf[nb];
          if (nbPart === 0) {
            frontEdge = true;
          } else if (nbPart !== part) {
            const nbZ = zBuf[nb];
            if (nbZ > z + 0.045) {
              behindEdge = true;
              break;
            } else if (z > nbZ + 0.045) {
              frontEdge = true;
            }
          }
        }

        if (behindEdge) {
          rBuf[cell] = (rBuf[cell] * 0.68) | 0;
          gBuf[cell] = (gBuf[cell] * 0.68) | 0;
          bBuf[cell] = (bBuf[cell] * 0.68) | 0;
          lumBuf[cell] = Math.max(0.08, lumBuf[cell] * 0.68);
        } else if (frontEdge) {
          rBuf[cell] = Math.min(255, (rBuf[cell] * 1.22) | 0);
          gBuf[cell] = Math.min(255, (gBuf[cell] * 1.22) | 0);
          bBuf[cell] = Math.min(255, (bBuf[cell] * 1.22) | 0);
          lumBuf[cell] = Math.min(1.0, lumBuf[cell] + 0.16);
        }
      }
    }
  }

  function drawParticleGlyph(x, y, z, glyph, col, alphaScale, isFront, cosY, sinY, cosP, sinP, centerX, centerY, projScale, camDist) {
    const x1 = x * cosY + z * sinY;
    const z1 = -x * sinY + z * cosY;
    const y2 = y * cosP - z1 * sinP;
    const z2 = y * sinP + z1 * cosP;

    const dz = camDist - z2;
    if (dz < 0.8) return;
    const scale = projScale / dz;
    const colIdx = ((centerX + x1 * scale) / cellW) | 0;
    const rowIdx = ((centerY - (y2 + 0.04) * scale) / cellH) | 0;
    if (colIdx < 0 || colIdx >= cols || rowIdx < 0 || rowIdx >= rows) return;

    const cell = rowIdx * cols + colIdx;
    if (isFront) {
      if (partBuf[cell] > 0 && z2 <= zBuf[cell]) return;
    } else {
      if (partBuf[cell] > 0) return;
    }

    ctx.fillStyle = getCachedColor(col[0] * alphaScale, col[1] * alphaScale, col[2] * alphaScale);
    ctx.fillText(glyph, colIdx * cellW, rowIdx * cellH);
  }

  function drawCrossSparkle(sp, t, cosY, sinY, cosP, sinP, centerX, centerY, projScale, camDist) {
    const x1 = sp.x * cosY + sp.z * sinY;
    const z1 = -sp.x * sinY + sp.z * cosY;
    const y2 = sp.y * cosP - z1 * sinP;
    const z2 = sp.y * sinP + z1 * cosP;

    const dz = camDist - z2;
    if (dz < 0.8) return;
    const scale = projScale / dz;
    const cx = ((centerX + x1 * scale) / cellW) | 0;
    const cy = ((centerY - (y2 + 0.04) * scale) / cellH) | 0;
    if (cx < 2 || cx >= cols - 2 || cy < 2 || cy >= rows - 2) return;

    const pulse = 0.5 + 0.5 * Math.sin(t * 2.4 + sp.phase);
    const centerCell = cy * cols + cx;
    if (partBuf[centerCell] > 0 && z2 < zBuf[centerCell]) return;

    const armBright = 0.48 + 0.52 * pulse;
    ctx.fillStyle = getCachedColor(
      sp.col[0] * (0.68 + 0.32 * pulse),
      sp.col[1] * (0.68 + 0.32 * pulse),
      sp.col[2] * (0.68 + 0.32 * pulse)
    );
    ctx.fillText('+', cx * cellW, cy * cellH);

    ctx.fillStyle = getCachedColor(sp.col[0] * armBright, sp.col[1] * armBright, sp.col[2] * armBright);
    const armOffsets = [[-1, 0, '-'], [1, 0, '-'], [0, -1, '|'], [0, 1, '|']];
    for (let k = 0; k < 4; k++) {
      const ax = cx + armOffsets[k][0], ay = cy + armOffsets[k][1];
      const cIdx = ay * cols + ax;
      if (partBuf[cIdx] === 0 || z2 > zBuf[cIdx]) {
        ctx.fillText(armOffsets[k][2], ax * cellW, ay * cellH);
      }
    }

    if (pulse > 0.58) {
      const tipBright = (pulse - 0.58) * 1.9;
      ctx.fillStyle = getCachedColor(sp.col[0] * tipBright, sp.col[1] * tipBright, sp.col[2] * tipBright);
      const tips = [[-2, 0, '.'], [2, 0, '.'], [0, -2, ':'], [0, 2, ':']];
      for (let k = 0; k < 4; k++) {
        const tx = cx + tips[k][0], ty = cy + tips[k][1];
        const cIdx = ty * cols + tx;
        if (partBuf[cIdx] === 0 || z2 > zBuf[cIdx]) {
          ctx.fillText(tips[k][2], tx * cellW, ty * cellH);
        }
      }
    }
  }

  function cellChar(cell) {
    if (partBuf[cell] === 0) return ' ';
    const rampId = rampBuf[cell];
    if (rampId === 255) return String.fromCharCode(charBuf[cell]);
    const ramp = RAMPS[rampId];
    const lum = clamp(lumBuf[cell], 0.06, 1.0);
    return ramp[Math.min(ramp.length - 1, (lum * ramp.length) | 0)];
  }

  function exportAsciiText() {
    let minR = rows, maxR = -1, minC = cols, maxC = -1;
    for (let r = 0; r < rows; r++) {
      const off = r * cols;
      for (let c = 0; c < cols; c++) {
        if (partBuf[off + c] > 0 && cellChar(off + c) !== ' ') {
          if (r < minR) minR = r;
          if (r > maxR) maxR = r;
          if (c < minC) minC = c;
          if (c > maxC) maxC = c;
        }
      }
    }
    if (maxR < minR) return '';
    const lines = [];
    for (let r = minR; r <= maxR; r++) {
      let line = '';
      const off = r * cols;
      for (let c = minC; c <= maxC; c++) {
        line += cellChar(off + c);
      }
      lines.push(line.replace(/\s+$/, ''));
    }
    if (cfg.caption.trim()) {
      lines.push('');
      lines.push('  ' + cfg.caption.trim());
    }
    return lines.join('\n');
  }

  let lastTime = performance.now();

  function renderFrame(now) {
    const dt = Math.min(0.05, (now - lastTime) * 0.001);
    lastTime = now;
    const t = now * 0.001;

    if (!state.dragging) {
      if (state.playing) {
        state.angleY += 0.40 * state.speedMul * dt;
      }
      state.angleY += state.velY;
      state.pitch = clamp(state.pitch + state.velP, -0.78, 0.92);
      state.velY *= 0.90;
      state.velP *= 0.90;
    }

    const drawerOffset = (!state.drawerCollapsed && !state.hudHidden && viewW >= 1020) ? 310 : 0;
    const targetCenterX = (viewW + drawerOffset) * 0.5;
    state.currentCenterX += (targetCenterX - state.currentCenterX) * Math.min(1, dt * 10);

    const centerX = state.currentCenterX;
    const centerY = viewH * 0.48;

    const grad = ctx.createRadialGradient(
      centerX, centerY, viewH * 0.04,
      centerX, centerY, Math.max(viewW, viewH) * 0.62
    );
    grad.addColorStop(0, '#141a2c');
    grad.addColorStop(0.54, '#0a0d17');
    grad.addColorStop(1, '#05060b');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, viewW, viewH);

    zBuf.fill(-1e9);
    partBuf.fill(0);

    const cosY = Math.cos(state.angleY);
    const sinY = Math.sin(state.angleY);
    const cosP = Math.cos(state.pitch);
    const sinP = Math.sin(state.pitch);

    const camDist = 5.4;
    const availW = Math.max(320, viewW - drawerOffset);
    const baseScale = Math.min(viewH * 0.80, availW * 0.84) / 3.65;
    const projScale = baseScale * camDist * state.zoom;

    rasterizeTriangles(activeBouquet.mesh, cosY, sinY, cosP, sinP, centerX, centerY, projScale, camDist, t);
    drawStemLines(activeBouquet.stems, cosY, sinY, cosP, sinP, centerX, centerY, projScale, camDist, t);

    if (state.edges) {
      applyContourPass();
    }

    const pList = activeBouquet.ambient.particles;
    for (let i = 0; i < pList.length; i++) {
      const p = pList[i];
      const driftA = t * p.orbit;
      const ca = Math.cos(driftA), sa = Math.sin(driftA);
      const wx = p.x * ca - p.z * sa;
      const wz = p.x * sa + p.z * ca;
      const wy = p.y + Math.sin(t * p.speed + p.phase) * 0.08;
      const twinkle = 0.35 + 0.45 * Math.sin(t * (1.5 + p.speed) + p.phase);
      drawParticleGlyph(wx, wy, wz, p.glyph, p.col, twinkle, false, cosY, sinY, cosP, sinP, centerX, centerY, projScale, camDist);
    }

    let prevColor = '';
    const total = cols * rows;
    for (let cell = 0; cell < total; cell++) {
      if (partBuf[cell] === 0) continue;
      const ch = cellChar(cell);
      if (ch === ' ') continue;

      const row = (cell / cols) | 0;
      const col = cell - row * cols;
      const colorStr = getCachedColor(rBuf[cell], gBuf[cell], bBuf[cell]);
      if (colorStr !== prevColor) {
        ctx.fillStyle = colorStr;
        prevColor = colorStr;
      }
      ctx.fillText(ch, col * cellW, row * cellH);
    }

    for (let i = 0; i < pList.length; i++) {
      const p = pList[i];
      const driftA = t * p.orbit;
      const ca = Math.cos(driftA), sa = Math.sin(driftA);
      const wx = p.x * ca - p.z * sa;
      const wz = p.x * sa + p.z * ca;
      const wy = p.y + Math.sin(t * p.speed + p.phase) * 0.08;
      const twinkle = 0.50 + 0.50 * Math.sin(t * (1.5 + p.speed) + p.phase);
      drawParticleGlyph(wx, wy, wz, p.glyph, p.col, twinkle, true, cosY, sinY, cosP, sinP, centerX, centerY, projScale, camDist);
    }

    const spList = activeBouquet.ambient.sparkles;
    for (let i = 0; i < spList.length; i++) {
      drawCrossSparkle(spList[i], t, cosY, sinY, cosP, sinP, centerX, centerY, projScale, camDist);
    }

    const cap = cfg.caption.trim();
    if (cap) {
      const capY = Math.min(viewH - 68, centerY + baseScale * 1.88 * Math.min(1.15, state.zoom));
      const pal = PALETTES[cfg.palette] || PALETTES.autumn;
      const cc = lerp3(pal.primary.mid, [255, 240, 244], 0.55);
      ctx.save();
      ctx.font = '13px "JetBrains Mono", "Cascadia Mono", Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = getCachedColor(cc[0], cc[1], cc[2]);
      ctx.fillText(cap, centerX, capY);
      ctx.restore();
      ctx.font = cellH + 'px "JetBrains Mono", "Cascadia Mono", "Fira Code", Consolas, "Courier New", monospace';
      ctx.textBaseline = 'top';
    }

    if (state.glow) {
      bloomCtx.clearRect(0, 0, bloomCanvas.width, bloomCanvas.height);
      bloomCtx.filter = 'blur(2.4px)';
      bloomCtx.drawImage(canvas, 0, 0, bloomCanvas.width, bloomCanvas.height);
      bloomCtx.filter = 'none';

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.28;
      ctx.drawImage(bloomCanvas, 0, 0, viewW, viewH);
      ctx.restore();
    }

    requestAnimationFrame(renderFrame);
  }

  function encodeHash() {
    try {
      const payload = {
        s: cfg.seed,
        p: cfg.preset,
        pal: cfg.palette,
        sp: cfg.species,
        sh: cfg.shape,
        n: cfg.bloomCount,
        g: cfg.greenery,
        r: cfg.ribbon,
        w: cfg.wrap,
        c: cfg.caption
      };
      const json = JSON.stringify(payload);
      return '#b=' + btoa(unescape(encodeURIComponent(json)));
    } catch (e) {
      return '';
    }
  }

  function saveHashQuiet() {
    const hash = encodeHash();
    if (!hash) return;
    try {
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', hash);
      }
    } catch (e) {

    }
  }

  function loadHashIfPresent() {
    try {
      const h = window.location.hash || '';
      if (!h.startsWith('#b=')) return false;
      const json = decodeURIComponent(escape(atob(h.slice(3))));
      const d = JSON.parse(json);
      if (typeof d.s === 'number') cfg.seed = d.s >>> 0;
      if (typeof d.p === 'string') cfg.preset = d.p;
      if (typeof d.pal === 'string' && PALETTES[d.pal]) cfg.palette = d.pal;
      if (Array.isArray(d.sp) && d.sp.length > 0) cfg.species = d.sp.filter(id => SPECIES_LIST.some(x => x.id === id));
      if (cfg.species.length === 0) cfg.species = ['rose'];
      if (typeof d.sh === 'string' && SHAPES.some(x => x.id === d.sh)) cfg.shape = d.sh;
      if (typeof d.n === 'number') cfg.bloomCount = clamp(Math.round(d.n), 6, 24);
      if (typeof d.g === 'number') cfg.greenery = clamp(Math.round(d.g), 0, 100);
      if (typeof d.r === 'string') cfg.ribbon = d.r;
      if (d.w === 'none' || d.w === 'veil') cfg.wrap = d.w;
      if (typeof d.c === 'string') cfg.caption = d.c.slice(0, 44);
      return true;
    } catch (e) {
      return false;
    }
  }

  function applyPreset(pr) {
    cfg.preset = pr.id;
    cfg.species = pr.species.slice();
    cfg.palette = pr.palette;
    cfg.shape = pr.shape;
    cfg.bloomCount = pr.bloomCount;
    cfg.greenery = pr.greenery;
    cfg.ribbon = pr.ribbon;
    cfg.wrap = pr.wrap;
    cfg.seed = Math.floor(Math.random() * 899999 + 100000);
    regenerateBouquet();
    syncUI();
  }

  function toggleSpecies(id) {
    const idx = cfg.species.indexOf(id);
    if (idx >= 0) {
      if (cfg.species.length <= 1) return;
      cfg.species.splice(idx, 1);
    } else {
      cfg.species.push(id);
    }
    cfg.preset = '';
    regenerateBouquet();
    syncUI();
  }

  function newSeedBouquet() {
    cfg.seed = Math.floor(Math.random() * 899999 + 100000);
    regenerateBouquet();
    syncUI();
  }

  function fullRandomize() {
    const palKeys = Object.keys(PALETTES);
    cfg.palette = palKeys[Math.floor(Math.random() * palKeys.length)];
    cfg.shape = SHAPES[Math.floor(Math.random() * SHAPES.length)].id;
    cfg.bloomCount = 9 + Math.floor(Math.random() * 12);
    cfg.greenery = 40 + Math.floor(Math.random() * 11) * 5;
    cfg.ribbon = 'auto';
    cfg.wrap = Math.random() < 0.25 ? 'veil' : 'none';
    cfg.preset = '';

    const countSp = 2 + Math.floor(Math.random() * 5);
    const pool = SPECIES_LIST.map(s => s.id);
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
    cfg.species = pool.slice(0, countSp);
    cfg.seed = Math.floor(Math.random() * 899999 + 100000);
    regenerateBouquet();
    syncUI();
  }

  function syncUI() {
    studioEl.classList.toggle('collapsed', state.drawerCollapsed || state.hudHidden);
    studioToggleEl.classList.toggle('hidden', !state.drawerCollapsed || state.hudHidden);
    hudEl.classList.toggle('hidden', state.hudHidden);

    seedBadgeEl.textContent = '#' + cfg.seed;
    speciesCountEl.textContent = cfg.species.length + ' of ' + SPECIES_LIST.length;

    for (const el of presetGridEl.children) {
      el.classList.toggle('active', el.dataset.preset === cfg.preset);
    }
    for (const el of speciesGridEl.children) {
      el.classList.toggle('active', cfg.species.includes(el.dataset.species));
    }
    for (const el of paletteRowEl.children) {
      el.classList.toggle('active', el.dataset.palette === cfg.palette);
    }
    for (const el of shapeRowEl.children) {
      el.classList.toggle('active', el.dataset.shape === cfg.shape);
    }
    for (const el of ribbonRowEl.children) {
      el.classList.toggle('active', el.dataset.ribbon === cfg.ribbon);
    }
    for (const el of wrapRowEl.children) {
      el.classList.toggle('active', el.dataset.wrap === cfg.wrap);
    }

    rngCountEl.value = String(cfg.bloomCount);
    valCountEl.textContent = String(cfg.bloomCount);
    rngGreenEl.value = String(cfg.greenery);
    valGreenEl.textContent = cfg.greenery + '%';
    rngSpeedEl.value = String(state.speedMul);
    valSpeedEl.textContent = state.speedMul.toFixed(1) + 'x';
    if (document.activeElement !== inpCaptionEl) {
      inpCaptionEl.value = cfg.caption;
    }

    btnPlay.textContent = state.playing ? 'Pause' : 'Play';
    btnPlay.classList.toggle('active', state.playing);
    btnGlow.textContent = state.glow ? 'Glow: On' : 'Glow: Off';
    btnGlow.classList.toggle('active', state.glow);
    btnDensity.textContent = state.densityLabels[state.densityIdx];
    btnDensity.classList.toggle('active', state.densityIdx !== 2);
    btnEdges.textContent = state.edges ? 'Edges: On' : 'Edges: Off';
    btnEdges.classList.toggle('active', state.edges);
  }

  function copyWithFeedback(btnEl, text) {
    const orig = btnEl.textContent;
    const done = () => {
      btnEl.textContent = '✓ Copied';
      setTimeout(() => { btnEl.textContent = orig; }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function fallbackCopy(text, cb) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (e) {}
    cb();
  }

  document.getElementById('btn-collapse').addEventListener('click', () => {
    state.drawerCollapsed = true;
    syncUI();
  });
  studioToggleEl.addEventListener('click', () => {
    state.drawerCollapsed = false;
    syncUI();
  });

  document.getElementById('btn-new-seed').addEventListener('click', newSeedBouquet);
  document.getElementById('btn-hud-new').addEventListener('click', newSeedBouquet);
  document.getElementById('btn-full-rand').addEventListener('click', fullRandomize);

  rngCountEl.addEventListener('input', () => {
    cfg.bloomCount = parseInt(rngCountEl.value, 10);
    valCountEl.textContent = String(cfg.bloomCount);
    cfg.preset = '';
    regenerateBouquet();
    syncUI();
  });

  rngGreenEl.addEventListener('input', () => {
    cfg.greenery = parseInt(rngGreenEl.value, 10);
    valGreenEl.textContent = cfg.greenery + '%';
    cfg.preset = '';
    regenerateBouquet();
    syncUI();
  });

  rngSpeedEl.addEventListener('input', () => {
    state.speedMul = parseFloat(rngSpeedEl.value);
    valSpeedEl.textContent = state.speedMul.toFixed(1) + 'x';
  });

  inpCaptionEl.addEventListener('input', () => {
    cfg.caption = inpCaptionEl.value.slice(0, 44);
    saveHashQuiet();
  });

  document.getElementById('btn-png').addEventListener('click', downloadPng);

  const btnAscii = document.getElementById('btn-ascii');
  btnAscii.addEventListener('click', () => {
    const txt = exportAsciiText();
    if (txt) copyWithFeedback(btnAscii, txt);
  });

  const btnShare = document.getElementById('btn-share');
  btnShare.addEventListener('click', () => {
    saveHashQuiet();
    const hash = encodeHash();
    const shareStr = window.location.href.split('#')[0] + hash;
    copyWithFeedback(btnShare, shareStr);
  });

  btnPlay.addEventListener('click', () => { state.playing = !state.playing; syncUI(); });
  btnGlow.addEventListener('click', () => { state.glow = !state.glow; syncUI(); });
  btnEdges.addEventListener('click', () => { state.edges = !state.edges; syncUI(); });
  btnDensity.addEventListener('click', () => {
    state.densityIdx = (state.densityIdx + 1) % state.densityLabels.length;
    resize();
    syncUI();
  });
  document.getElementById('btn-reset').addEventListener('click', () => {
    state.angleY = 0.0;
    state.pitch = 0.24;
    state.zoom = 1.0;
    state.velY = 0.0;
    state.velP = 0.0;
    state.playing = true;
    syncUI();
  });

  canvas.addEventListener('pointerdown', (e) => {
    state.dragging = true;
    state.lastX = e.clientX;
    state.lastY = e.clientY;
    state.velY = 0;
    state.velP = 0;
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!state.dragging) return;
    const dx = e.clientX - state.lastX;
    const dy = e.clientY - state.lastY;
    state.lastX = e.clientX;
    state.lastY = e.clientY;

    const dAngle = dx * 0.0085;
    const dPitch = dy * 0.0065;
    state.angleY += dAngle;
    state.pitch = clamp(state.pitch + dPitch, -0.78, 0.92);
    state.velY = dAngle * 0.65;
    state.velP = dPitch * 0.65;
  });

  function stopDrag() { state.dragging = false; }
  canvas.addEventListener('pointerup', stopDrag);
  canvas.addEventListener('pointercancel', stopDrag);

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = e.deltaY > 0 ? 0.92 : 1.08;
    state.zoom = clamp(state.zoom * factor, 0.58, 2.20);
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;

    if (e.code === 'Space') {
      e.preventDefault();
      state.playing = !state.playing;
      syncUI();
    } else if (e.code === 'Tab') {
      e.preventDefault();
      state.drawerCollapsed = !state.drawerCollapsed;
      syncUI();
    } else if (e.code === 'KeyN') {
      newSeedBouquet();
    } else if (e.code === 'KeyR') {
      state.angleY = 0.0;
      state.pitch = 0.24;
      state.zoom = 1.0;
      state.velY = 0.0;
      state.velP = 0.0;
      state.playing = true;
      syncUI();
    } else if (e.code === 'KeyG') {
      state.glow = !state.glow;
      syncUI();
    } else if (e.code === 'KeyD') {
      state.densityIdx = (state.densityIdx + 1) % state.densityLabels.length;
      resize();
      syncUI();
    } else if (e.code === 'KeyE') {
      state.edges = !state.edges;
      syncUI();
    } else if (e.code === 'KeyH') {
      state.hudHidden = !state.hudHidden;
      syncUI();
    }
  });

  window.addEventListener('resize', resize);

  loadHashIfPresent();
  buildStudioControls();
  resize();
  regenerateBouquet();
  syncUI();
  requestAnimationFrame(renderFrame);
})();
</script>
</body>
</html>
