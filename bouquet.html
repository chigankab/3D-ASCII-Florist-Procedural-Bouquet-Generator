<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D ASCII Florist — Bouquet Generator</title>
<style>
  :root {
    --bg-panel: rgba(11, 14, 24, 0.84);
    --border-panel: rgba(244, 196, 198, 0.16);
    --border-strong: rgba(244, 196, 198, 0.38);
    --text-main: #f3dcde;
    --text-dim: rgba(236, 208, 212, 0.62);
    --accent: #ef8354;
    --accent-soft: rgba(239, 131, 84, 0.20);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #06080e;
    background: radial-gradient(circle at 50% 46%, #141a2c 0%, #0a0d17 55%, #05060b 100%);
    font-family: 'JetBrains Mono', 'Cascadia Mono', 'Fira Code', 'Consolas', 'Courier New', monospace;
    color: var(--text-main);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  #scene {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: grab;
  }

  #scene:active {
    cursor: grabbing;
  }

  .scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.10;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0) 0px,
      rgba(255, 255, 255, 0) 2px,
      rgba(0, 0, 0, 0.42) 3px,
      rgba(0, 0, 0, 0.42) 4px
    );
  }

  #studio-toggle {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 30;
    appearance: none;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 12px;
    border-radius: 999px;
    background: var(--bg-panel);
    border: 1px solid var(--border-panel);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--text-main);
    font-family: inherit;
    font-size: 11.5px;
    cursor: pointer;
    transition: opacity 0.2s ease, border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }

  #studio-toggle:hover {
    border-color: var(--border-strong);
    background: rgba(18, 22, 36, 0.94);
  }

  #studio-toggle.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateY(-10px);
  }

  #studio {
    position: fixed;
    top: 14px;
    left: 14px;
    bottom: 14px;
    width: 296px;
    z-index: 25;
    display: flex;
    flex-direction: column;
    border-radius: 16px;
    background: var(--bg-panel);
    border: 1px solid var(--border-panel);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 18px 46px rgba(0, 0, 0, 0.55);
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.22s ease;
    overflow: hidden;
  }

  #studio.collapsed {
    transform: translateX(-330px);
    opacity: 0;
    pointer-events: none;
  }

  .studio-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px 10px;
    border-bottom: 1px solid rgba(244, 196, 198, 0.11);
    flex-shrink: 0;
  }

  .studio-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #fff0f0;
  }

  .seed-badge {
    font-size: 10px;
    font-weight: 400;
    color: var(--text-dim);
    background: rgba(255, 255, 255, 0.06);
    padding: 2px 6px;
    border-radius: 6px;
  }

  .icon-btn {
    appearance: none;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(244, 196, 198, 0.16);
    color: var(--text-main);
    font-family: inherit;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .icon-btn:hover {
    background: rgba(255, 255, 255, 0.14);
    border-color: var(--border-strong);
  }

  .studio-body {
    flex: 1;
    overflow-y: auto;
    padding: 10px 13px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .studio-body::-webkit-scrollbar {
    width: 5px;
  }
  .studio-body::-webkit-scrollbar-thumb {
    background: rgba(244, 196, 198, 0.18);
    border-radius: 99px;
  }

  .sec-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .btn-row {
    display: flex;
    gap: 6px;
  }

  .action-btn {
    flex: 1;
    appearance: none;
    background: rgba(239, 131, 84, 0.16);
    border: 1px solid rgba(239, 131, 84, 0.42);
    color: #ffe3d3;
    font-family: inherit;
    font-size: 11px;
    padding: 7px 8px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.16s ease, transform 0.12s ease, border-color 0.16s ease;
    text-align: center;
  }

  .action-btn:hover {
    background: rgba(239, 131, 84, 0.28);
    border-color: rgba(255, 174, 132, 0.72);
  }

  .action-btn:active {
    transform: scale(0.97);
  }

  .action-btn.secondary {
    background: rgba(244, 196, 198, 0.08);
    border-color: rgba(244, 196, 198, 0.20);
    color: var(--text-main);
  }

  .action-btn.secondary:hover {
    background: rgba(244, 196, 198, 0.18);
    border-color: var(--border-strong);
  }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
  }

  .chip-btn {
    appearance: none;
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(244, 196, 198, 0.14);
    color: rgba(243, 220, 222, 0.80);
    font-family: inherit;
    font-size: 10.5px;
    padding: 5px 7px;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .chip-btn:hover {
    background: rgba(255, 255, 255, 0.10);
    border-color: rgba(244, 196, 198, 0.34);
  }

  .chip-btn.active {
    background: var(--accent-soft);
    border-color: rgba(239, 131, 84, 0.58);
    color: #fff2eb;
  }

  .swatch-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1px solid rgba(255, 255, 255, 0.35);
  }

  .palette-row {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .pal-btn {
    appearance: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(244, 196, 198, 0.15);
    color: rgba(243, 220, 222, 0.82);
    font-family: inherit;
    font-size: 10.5px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .pal-btn:hover {
    background: rgba(255, 255, 255, 0.11);
  }

  .pal-btn.active {
    background: rgba(244, 196, 198, 0.18);
    border-color: rgba(255, 212, 214, 0.60);
    color: #ffffff;
  }

  .seg-row {
    display: flex;
    gap: 4px;
  }

  .seg-btn {
    flex: 1;
    appearance: none;
    padding: 5px 4px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(244, 196, 198, 0.14);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 10px;
    cursor: pointer;
    text-align: center;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }

  .seg-btn.active {
    background: var(--accent-soft);
    border-color: rgba(239, 131, 84, 0.56);
    color: #fff2eb;
  }

  .slider-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .slider-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .slider-head {
    display: flex;
    justify-content: space-between;
    font-size: 10.5px;
    color: var(--text-main);
  }

  .slider-val {
    color: #ffb899;
  }

  input[type="range"] {
    width: 100%;
    height: 4px;
    appearance: none;
    background: rgba(244, 196, 198, 0.18);
    border-radius: 99px;
    outline: none;
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #f59c72;
    border: 1px solid #fff0eb;
    cursor: pointer;
  }

  .ribbon-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    align-items: center;
  }

  .rib-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, 0.25);
    cursor: pointer;
    appearance: none;
    transition: transform 0.14s ease, border-color 0.14s ease;
    font-size: 9px;
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .rib-dot:hover {
    transform: scale(1.1);
  }

  .rib-dot.active {
    border-color: #ffffff;
    box-shadow: 0 0 0 2px rgba(239, 131, 84, 0.55);
  }

  .caption-input {
    width: 100%;
    background: rgba(6, 8, 14, 0.72);
    border: 1px solid rgba(244, 196, 198, 0.22);
    border-radius: 8px;
    padding: 6px 9px;
    color: #fff0f2;
    font-family: inherit;
    font-size: 11px;
    outline: none;
    user-select: text;
    -webkit-user-select: text;
    transition: border-color 0.15s ease;
  }

  .caption-input:focus {
    border-color: rgba(239, 131, 84, 0.72);
  }

  .export-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 5px;
  }

  .studio-stats {
    font-size: 9.5px;
    color: var(--text-dim);
    text-align: center;
    padding-top: 2px;
  }

  #hud {
    position: fixed;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(10, 13, 22, 0.72);
    border: 1px solid var(--border-panel);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0.52;
    transition: opacity 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
    z-index: 20;
    white-space: nowrap;
  }

  #hud:hover {
    opacity: 0.98;
    border-color: var(--border-strong);
  }

  #hud.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateX(-50%) translateY(14px);
  }

  #hud button {
    appearance: none;
    background: rgba(244, 196, 198, 0.08);
    border: 1px solid rgba(244, 196, 198, 0.18);
    color: #f4d4d6;
    font-family: inherit;
    font-size: 10.5px;
    padding: 4px 9px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
  }

  #hud button:hover {
    background: rgba(244, 196, 198, 0.20);
    border-color: var(--border-strong);
    color: #fff;
  }

  #hud button.active {
    background: var(--accent-soft);
    border-color: rgba(244, 168, 120, 0.55);
    color: #ffd9be;
  }

  .hud-sep {
    width: 1px;
    height: 13px;
    background: rgba(244, 196, 198, 0.18);
    margin: 0 2px;
  }

  .hud-hint {
    font-size: 10px;
    color: var(--text-dim);
    padding-left: 2px;
  }

  @media (max-width: 780px) {
    #studio {
      width: min(296px, 88vw);
    }
    #hud {
      bottom: 10px;
      padding: 5px 9px;
      gap: 4px;
      max-width: 95vw;
      overflow-x: auto;
    }
    .hud-hint {
      display: none;
    }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="scanlines"></div>

<button id="studio-toggle" title="Open bouquet studio (Tab)">⚙ Studio</button>

<aside id="studio" aria-label="Bouquet Studio">
  <div class="studio-head">
    <div class="studio-title">
      <span>ASCII Florist</span>
      <span id="seed-badge" class="seed-badge">#104821</span>
    </div>
    <button id="btn-collapse" class="icon-btn" title="Collapse panel (Tab)">✕</button>
  </div>

  <div class="studio-body">
    <div class="btn-row">
      <button id="btn-new-seed" class="action-btn" title="Generate new variation (N)">🎲 New Bouquet</button>
      <button id="btn-full-rand" class="action-btn secondary" title="Randomize preset, palette and species">✨ Randomize</button>
    </div>

    <div>
      <div class="sec-label"><span>Style / Preset</span></div>
      <div id="preset-grid" class="grid-2"></div>
    </div>

    <div>
      <div class="sec-label">
        <span>Flowers in Bouquet</span>
        <span id="species-count"></span>
      </div>
      <div id="species-grid" class="grid-2"></div>
    </div>

    <div>
      <div class="sec-label"><span>Color Palette</span></div>
      <div id="palette-row" class="palette-row"></div>
    </div>

    <div>
      <div class="sec-label"><span>Bouquet Shape</span></div>
      <div id="shape-row" class="seg-row"></div>
    </div>

    <div class="slider-group">
      <div class="slider-row">
        <div class="slider-head"><span>Blooms</span><span id="val-count" class="slider-val">14</span></div>
        <input id="rng-count" type="range" min="6" max="24" step="1" value="14">
      </div>
      <div class="slider-row">
        <div class="slider-head"><span>Greenery</span><span id="val-green" class="slider-val">65%</span></div>
        <input id="rng-green" type="range" min="0" max="100" step="5" value="65">
      </div>
      <div class="slider-row">
        <div class="slider-head"><span>Rotation Speed</span><span id="val-speed" class="slider-val">1.0x</span></div>
        <input id="rng-speed" type="range" min="0" max="2.5" step="0.1" value="1.0">
      </div>
    </div>

    <div>
      <div class="sec-label"><span>Ribbon &amp; Wrap</span></div>
      <div style="display:flex; flex-direction:column; gap:7px;">
        <div id="ribbon-row" class="ribbon-pills"></div>
        <div id="wrap-row" class="seg-row"></div>
      </div>
    </div>

    <div>
      <div class="sec-label"><span>Caption Below Bouquet</span></div>
      <input id="inp-caption" class="caption-input" type="text" maxlength="44" placeholder="e.g. for you ♥">
    </div>

    <div>
      <div class="sec-label"><span>Export &amp; Save</span></div>
      <div class="export-row">
        <button id="btn-png" class="action-btn secondary" title="Download PNG snapshot">📸 PNG</button>
        <button id="btn-ascii" class="action-btn secondary" title="Copy ASCII text">📋 ASCII</button>
        <button id="btn-share" class="action-btn secondary" title="Copy recipe link/hash">🔗 Recipe</button>
      </div>
    </div>

    <div id="studio-stats" class="studio-stats"></div>
  </div>
</aside>

<div id="hud" aria-label="Quick controls">
  <button id="btn-play" class="active" title="Pause / Play (Space)">Pause</button>
  <button id="btn-glow" class="active" title="Toggle phosphor glow (G)">Glow: On</button>
  <button id="btn-density" class="active" title="Cycle ASCII grid resolution (D)">Detailed</button>
  <button id="btn-edges" class="active" title="Toggle petal edge contours (E)">Edges: On</button>
  <button id="btn-hud-new" title="New bouquet variation (N)">🎲 New</button>
  <button id="btn-reset" title="Reset view (R)">Reset</button>
  <span class="hud-sep"></span>
  <span class="hud-hint">drag · scroll · Tab panel · H hide</span>
</div>

<script>
(() => {
  'use strict';

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function clamp(v, lo, hi) {
    return v < lo ? lo : v > hi ? hi : v;
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function lerp3(c0, c1, t) {
    return [
      c0[0] + (c1[0] - c0[0]) * t,
      c0[1] + (c1[1] - c0[1]) * t,
      c0[2] + (c1[2] - c0[2]) * t
    ];
  }

  function normalize3(x, y, z) {
    const len = Math.hypot(x, y, z) || 1;
    return [x / len, y / len, z / len];
  }

  function cross3(ax, ay, az, bx, by, bz) {
    return [
      ay * bz - az * by,
      az * bx - ax * bz,
      ax * by - ay * bx
    ];
  }

  function buildBasis(dx, dy, dz) {
    const f = normalize3(dx, dy, dz);
    const refUp = Math.abs(f[1]) > 0.96 ? [1, 0, 0] : [0, 1, 0];
    const rc = cross3(refUp[0], refUp[1], refUp[2], f[0], f[1], f[2]);
    const r = normalize3(rc[0], rc[1], rc[2]);
    const u = cross3(f[0], f[1], f[2], r[0], r[1], r[2]);
    return { f, r, u };
  }

  function evalBezier(p0, p1, p2, p3, t) {
    const mt = 1 - t;
    const mt2 = mt * mt;
    const t2 = t * t;
    const a = mt2 * mt;
    const b = 3 * mt2 * t;
    const c = 3 * mt * t2;
    const d = t2 * t;
    return [
      a * p0[0] + b * p1[0] + c * p2[0] + d * p3[0],
      a * p0[1] + b * p1[1] + c * p2[1] + d * p3[1],
      a * p0[2] + b * p1[2] + c * p2[2] + d * p3[2]
    ];
  }

  const FLAG_DOUBLE_SIDED = 1;
  const FLAG_EMISSIVE_TIP = 2;

  class MeshBuilder {
    constructor() {
      this.vPos = [];
      this.vNorm = [];
      this.vCol = [];
      this.vAttr = [];
      this.triIdx = [];
      this.triMeta = [];
      this.vCount = 0;
      this.tCount = 0;
      this._partCounter = 1;
    }

    nextPartId() {
      const id = this._partCounter;
      this._partCounter = (this._partCounter % 65534) + 1;
      return id;
    }

    addVertex(x, y, z, nx, ny, nz, r, g, b, ao = 1.0, rimBoost = 0.0, sway = 0.14) {
      const nLen = Math.hypot(nx, ny, nz) || 1;
      this.vPos.push(x, y, z);
      this.vNorm.push(nx / nLen, ny / nLen, nz / nLen);
      this.vCol.push(
        clamp(Math.round(r), 0, 255),
        clamp(Math.round(g), 0, 255),
        clamp(Math.round(b), 0, 255)
      );
      this.vAttr.push(ao, rimBoost, sway);
      return this.vCount++;
    }

    addTri(i0, i1, i2, rampId, flags, specPow, specStr, partId) {
      this.triIdx.push(i0, i1, i2);
      this.triMeta.push(
        rampId & 255,
        flags & 255,
        clamp(Math.round(specPow), 1, 255),
        clamp(Math.round(specStr * 255), 0, 255),
        partId & 65535
      );
      this.tCount++;
    }

    addParametricPatch(uSteps, vSteps, evalPos, evalColor, evalAO, evalRim, evalSway, rampId, flags, specPow, specStr, partId) {
      const cols = uSteps + 1;
      const baseV = this.vCount;
      const eps = 0.012;

      for (let iv = 0; iv <= vSteps; iv++) {
        const v = iv / vSteps;
        const vNext = Math.min(1, v + eps);
        const vPrev = Math.max(0, v - eps);
        for (let iu = 0; iu <= uSteps; iu++) {
          const u = iu / uSteps;
          const uNext = Math.min(1, u + eps);
          const uPrev = Math.max(0, u - eps);

          const p = evalPos(u, v);
          const pu1 = evalPos(uNext, v);
          const pu0 = evalPos(uPrev, v);
          const pv1 = evalPos(u, vNext);
          const pv0 = evalPos(u, vPrev);

          const n = cross3(
            pu1[0] - pu0[0], pu1[1] - pu0[1], pu1[2] - pu0[2],
            pv1[0] - pv0[0], pv1[1] - pv0[1], pv1[2] - pv0[2]
          );
          const c = evalColor(u, v, p);
          const ao = evalAO(u, v, p);
          const rim = evalRim ? evalRim(u, v, p) : 0;
          const sw = evalSway ? evalSway(u, v, p) : 0.14;

          this.addVertex(p[0], p[1], p[2], n[0], n[1], n[2], c[0], c[1], c[2], ao, rim, sw);
        }
      }

      for (let iv = 0; iv < vSteps; iv++) {
        for (let iu = 0; iu < uSteps; iu++) {
          const a = baseV + iv * cols + iu;
          const b = a + 1;
          const c = a + cols;
          const d = c + 1;
          this.addTri(a, b, d, rampId, flags, specPow, specStr, partId);
          this.addTri(a, d, c, rampId, flags, specPow, specStr, partId);
        }
      }
    }

    pack() {
      const vc = this.vCount;
      const tc = this.tCount;
      const vx = new Float32Array(vc);
      const vy = new Float32Array(vc);
      const vz = new Float32Array(vc);
      const vnx = new Float32Array(vc);
      const vny = new Float32Array(vc);
      const vnz = new Float32Array(vc);
      const vcr = new Uint8Array(vc);
      const vcg = new Uint8Array(vc);
      const vcb = new Uint8Array(vc);
      const vao = new Float32Array(vc);
      const vrim = new Float32Array(vc);
      const vsway = new Float32Array(vc);

      for (let i = 0; i < vc; i++) {
        const i3 = i * 3;
        vx[i] = this.vPos[i3];
        vy[i] = this.vPos[i3 + 1];
        vz[i] = this.vPos[i3 + 2];
        vnx[i] = this.vNorm[i3];
        vny[i] = this.vNorm[i3 + 1];
        vnz[i] = this.vNorm[i3 + 2];
        vcr[i] = this.vCol[i3];
        vcg[i] = this.vCol[i3 + 1];
        vcb[i] = this.vCol[i3 + 2];
        vao[i] = this.vAttr[i3];
        vrim[i] = this.vAttr[i3 + 1];
        vsway[i] = this.vAttr[i3 + 2];
      }

      const ti0 = new Uint32Array(tc);
      const ti1 = new Uint32Array(tc);
      const ti2 = new Uint32Array(tc);
      const tRamp = new Uint8Array(tc);
      const tFlags = new Uint8Array(tc);
      const tSpecPow = new Uint8Array(tc);
      const tSpecStr = new Uint8Array(tc);
      const tPart = new Uint16Array(tc);

      for (let t = 0; t < tc; t++) {
        const t3 = t * 3;
        const t5 = t * 5;
        ti0[t] = this.triIdx[t3];
        ti1[t] = this.triIdx[t3 + 1];
        ti2[t] = this.triIdx[t3 + 2];
        tRamp[t] = this.triMeta[t5];
        tFlags[t] = this.triMeta[t5 + 1];
        tSpecPow[t] = this.triMeta[t5 + 2];
        tSpecStr[t] = this.triMeta[t5 + 3];
        tPart[t] = this.triMeta[t5 + 4];
      }

      return {
        vCount: vc, tCount: tc,
        vx, vy, vz, vnx, vny, vnz, vcr, vcg, vcb, vao, vrim, vsway,
        ti0, ti1, ti2, tRamp, tFlags, tSpecPow, tSpecStr, tPart
      };
    }
  }

  class StemList {
    constructor() {
      this.segments = [];
    }

    addSegment(p0, p1, c0, c1, thick, sway0, sway1, partId, tipGlyph = 0, bodyGlyph = 0) {
      this.segments.push({
        x0: p0[0], y0: p0[1], z0: p0[2],
        x1: p1[0], y1: p1[1], z1: p1[2],
        r0: c0[0], g0: c0[1], b0: c0[2],
        r1: c1[0], g1: c1[1], b1: c1[2],
        thick, sway0, sway1, partId, tipGlyph, bodyGlyph
      });
    }

    addBezier(p0, p1, p2, p3, segs, colStart, colEnd, thick, swayStart, swayEnd, partId, bodyGlyph = 0) {
      let prev = p0;
      for (let i = 1; i <= segs; i++) {
        const t0 = (i - 1) / segs;
        const t1 = i / segs;
        const curr = evalBezier(p0, p1, p2, p3, t1);
        this.addSegment(
          prev, curr,
          lerp3(colStart, colEnd, t0),
          lerp3(colStart, colEnd, t1),
          thick,
          lerp(swayStart, swayEnd, t0),
          lerp(swayStart, swayEnd, t1),
          partId, 0, bodyGlyph
        );
        prev = curr;
      }
    }
  }

  function addCalyx(mesh, pos, dir, radius, leafCol, sway = 0.14) {
    const basis = buildBasis(dir[0], dir[1], dir[2]);
    for (let k = 0; k < 5; k++) {
      const ang = (k / 5) * Math.PI * 2 + 0.3;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const rx = basis.r[0] * ca + basis.u[0] * sa;
      const ry = basis.r[1] * ca + basis.u[1] * sa;
      const rz = basis.r[2] * ca + basis.u[2] * sa;
      const tx = -basis.r[0] * sa + basis.u[0] * ca;
      const ty = -basis.r[1] * sa + basis.u[1] * ca;
      const tz = -basis.r[2] * sa + basis.u[2] * ca;
      const partId = mesh.nextPartId();

      mesh.addParametricPatch(
        2, 3,
        (uu, v) => {
          const u = uu * 2 - 1;
          const w = (1 - v) * 0.22 * radius;
          const out = (0.14 + 0.52 * v) * radius;
          const fwd = (-0.12 + 0.24 * Math.sin(v * Math.PI * 0.85)) * radius;
          return [
            pos[0] + rx * out + tx * u * w + basis.f[0] * fwd,
            pos[1] + ry * out + ty * u * w + basis.f[1] * fwd,
            pos[2] + rz * out + tz * u * w + basis.f[2] * fwd
          ];
        },
        (uu, v) => lerp3(leafCol.base, leafCol.tip, v),
        (uu, v) => 0.45 + 0.55 * v,
        (uu, v) => v > 0.7 ? 0.3 : 0.0,
        () => sway,
        3, FLAG_DOUBLE_SIDED, 14, 0.25, partId
      );
    }
  }

  function addRose(mesh, pos, dir, radius, colors, leafCol, rng, dense = false) {
    const basis = buildBasis(dir[0], dir[1], dir[2]);
    const goldenAngle = 2.399963229728653;
    const petalCount = 20;
    const steps = dense ? 4 : 5;

    addCalyx(
      mesh,
      [pos[0] - basis.f[0] * radius * 0.04, pos[1] - basis.f[1] * radius * 0.04, pos[2] - basis.f[2] * radius * 0.04],
      dir, radius * 0.62, leafCol, 0.14
    );

    for (let pIdx = 0; pIdx < petalCount; pIdx++) {
      const t = pIdx / (petalCount - 1);
      const angle = pIdx * goldenAngle + (rng() - 0.5) * 0.12;
      const ca = Math.cos(angle), sa = Math.sin(angle);
      const rx = basis.r[0] * ca + basis.u[0] * sa;
      const ry = basis.r[1] * ca + basis.u[1] * sa;
      const rz = basis.r[2] * ca + basis.u[2] * sa;
      const tx = -basis.r[0] * sa + basis.u[0] * ca;
      const ty = -basis.r[1] * sa + basis.u[1] * ca;
      const tz = -basis.r[2] * sa + basis.u[2] * ca;

      const baseR = radius * (0.04 + 0.56 * Math.pow(t, 0.85));
      const pH = radius * (0.44 + 0.44 * Math.pow(t, 0.65));
      const pW = radius * (0.30 + 0.46 * Math.pow(t, 0.65));
      const tiltOut = 0.18 + 1.15 * Math.pow(t, 0.90);
      const partId = mesh.nextPartId();

      mesh.addParametricPatch(
        steps, steps,
        (uu, v) => {
          const u = uu * 2 - 1;
          const widthEnv = Math.sin(Math.pow(v, 0.52) * Math.PI * 0.88);
          const notch = Math.exp(-u * u * 18) * 0.05 * radius * Math.pow(v, 2.0);
          const phi = u * (0.76 + 0.40 * (1 - t));
          const lipCurl = Math.pow(Math.max(0, v - 0.55) / 0.45, 2.0) * radius * (0.12 + 0.22 * t);
          const outDist = baseR + v * pH * Math.sin(tiltOut) + lipCurl - (1 - Math.cos(phi)) * pW * 0.40;
          const fwdDist = v * pH * Math.cos(tiltOut) + (1 - v) * radius * 0.06 - lipCurl * 0.38 - notch;
          const sideDist = Math.sin(phi) * pW * widthEnv;
          return [
            pos[0] + rx * outDist + tx * sideDist + basis.f[0] * fwdDist,
            pos[1] + ry * outDist + ty * sideDist + basis.f[1] * fwdDist,
            pos[2] + rz * outDist + tz * sideDist + basis.f[2] * fwdDist
          ];
        },
        (uu, v) => {
          const u = uu * 2 - 1;
          const c = lerp3(colors.inner, colors.mid, clamp(t * 0.92 + v * 0.35, 0, 1));
          const rimMix = Math.pow(v, 1.4) * (0.55 + 0.45 * t);
          return lerp3(c, colors.edge, clamp(rimMix * (0.60 + 0.40 * Math.abs(u)), 0, 1));
        },
        (uu, v) => clamp((0.26 + 0.74 * Math.pow(t, 0.65)) * (0.36 + 0.64 * Math.pow(v, 0.65)) + 0.06, 0.22, 1.0),
        (uu, v) => v > 0.78 ? (v - 0.78) * 3.8 : 0.0,
        () => 0.14 + 0.16 * t,
        0, FLAG_DOUBLE_SIDED, 11, 0.20, partId
      );
    }
  }

  function addRoseBud(mesh, pos, dir, radius, colors, leafCol) {
    const basis = buildBasis(dir[0], dir[1], dir[2]);
    const goldenAngle = 2.399963229728653;

    for (let k = 0; k < 7; k++) {
      const t = k / 6;
      const ang = k * goldenAngle;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const rx = basis.r[0] * ca + basis.u[0] * sa;
      const ry = basis.r[1] * ca + basis.u[1] * sa;
      const rz = basis.r[2] * ca + basis.u[2] * sa;
      const tx = -basis.r[0] * sa + basis.u[0] * ca;
      const ty = -basis.r[1] * sa + basis.u[1] * ca;
      const tz = -basis.r[2] * sa + basis.u[2] * ca;
      const partId = mesh.nextPartId();

      mesh.addParametricPatch(
        3, 4,
        (uu, v) => {
          const u = uu * 2 - 1;
          const bulge = Math.sin(Math.pow(v, 0.68) * Math.PI * 0.92);
          const phi = u * 0.88;
          const out = radius * (0.18 + 0.42 * bulge + 0.14 * t * v) - (1 - Math.cos(phi)) * radius * 0.22;
          const fwd = radius * (1.35 * v);
          const side = Math.sin(phi) * radius * 0.36 * bulge;
          return [
            pos[0] + rx * out + tx * side + basis.f[0] * fwd,
            pos[1] + ry * out + ty * side + basis.f[1] * fwd,
            pos[2] + rz * out + tz * side + basis.f[2] * fwd
          ];
        },
        (uu, v) => lerp3(colors.inner, colors.edge, clamp(v * 0.85 + t * 0.25, 0, 1)),
        (uu, v) => 0.42 + 0.58 * v,
        (uu, v) => v > 0.72 ? (v - 0.72) * 2.5 : 0.0,
        () => 0.22,
        0, FLAG_DOUBLE_SIDED, 12, 0.24, partId
      );
    }

    for (let s = 0; s < 5; s++) {
      const ang = (s / 5) * Math.PI * 2 + 0.25;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const rx = basis.r[0] * ca + basis.u[0] * sa;
      const ry = basis.r[1] * ca + basis.u[1] * sa;
      const rz = basis.r[2] * ca + basis.u[2] * sa;
      const tx = -basis.r[0] * sa + basis.u[0] * ca;
      const ty = -basis.r[1] * sa + basis.u[1] * ca;
      const tz = -basis.r[2] * sa + basis.u[2] * ca;
      const partId = mesh.nextPartId();

      mesh.addParametricPatch(
        2, 3,
        (uu, v) => {
          const u = uu * 2 - 1;
          const flare = v > 0.65 ? (v - 0.65) * 0.65 : 0;
          const out = radius * (0.20 + 0.38 * Math.sin(v * Math.PI * 0.65) + flare);
          const fwd = radius * (-0.06 + 1.05 * v);
          const w = u * radius * 0.18 * (1 - v * 0.85);
          return [
            pos[0] + rx * out + tx * w + basis.f[0] * fwd,
            pos[1] + ry * out + ty * w + basis.f[1] * fwd,
            pos[2] + rz * out + tz * w + basis.f[2] * fwd
          ];
        },
        (uu, v) => lerp3(leafCol.base, leafCol.tip, v),
        (uu, v) => 0.55 + 0.45 * v,
        () => 0.1,
        () => 0.24,
        3, FLAG_DOUBLE_SIDED, 14, 0.25, partId
      );
    }
  }

  function addTulip(mesh, pos, dir, radius, colors, centerCol) {
    const basis = buildBasis(dir[0], dir[1], dir[2]);
    for (let tier = 0; tier < 2; tier++) {
      for (let k = 0; k < 3; k++) {
        const ang = (k / 3) * Math.PI * 2 + tier * (Math.PI / 3);
        const ca = Math.cos(ang), sa = Math.sin(ang);
        const rx = basis.r[0] * ca + basis.u[0] * sa;
        const ry = basis.r[1] * ca + basis.u[1] * sa;
        const rz = basis.r[2] * ca + basis.u[2] * sa;
        const tx = -basis.r[0] * sa + basis.u[0] * ca;
        const ty = -basis.r[1] * sa + basis.u[1] * ca;
        const tz = -basis.r[2] * sa + basis.u[2] * ca;
        const partId = mesh.nextPartId();
        const rScale = tier === 0 ? 0.90 : 1.02;

        mesh.addParametricPatch(
          5, 6,
          (uu, v) => {
            const u = uu * 2 - 1;
            const cup = Math.sin(Math.pow(v, 0.55) * Math.PI * 0.88);
            const phi = u * 0.86;
            const out = radius * rScale * (0.08 + 0.44 * Math.sin(v * Math.PI * 0.72) + 0.08 * tier) - (1 - Math.cos(phi)) * radius * 0.24;
            const fwd = radius * (1.28 * v);
            const side = Math.sin(phi) * radius * 0.44 * cup;
            return [
              pos[0] + rx * out + tx * side + basis.f[0] * fwd,
              pos[1] + ry * out + ty * side + basis.f[1] * fwd,
              pos[2] + rz * out + tz * side + basis.f[2] * fwd
            ];
          },
          (uu, v) => {
            const c = lerp3(colors.inner, colors.mid, clamp(v * 0.95, 0, 1));
            return lerp3(c, colors.edge, Math.pow(v, 1.5) * 0.85);
          },
          (uu, v) => 0.38 + 0.62 * Math.pow(v, 0.55),
          (uu, v) => v > 0.78 ? (v - 0.78) * 3.2 : 0.0,
          () => 0.16,
          1, FLAG_DOUBLE_SIDED, 24, 0.62, partId
        );
      }
    }

    const cId = mesh.nextPartId();
    mesh.addParametricPatch(
      5, 3,
      (uu, v) => {
        const a = uu * Math.PI * 2;

        ];

  function addCymbidiumOrchid(mesh, pos, dir, radius, colors, centerCol, leafCol) {
    const basis = buildBasis(dir[0], dir[1], dir[2]);
    addCalyx(mesh, pos, dir, radius * 0.32, leafCol, 0.14);

    const angles = [Math.PI * 0.5, Math.PI * 0.10, Math.PI * 0.90, -Math.PI * 0.24, -Math.PI * 0.76];
    const hoods = [0.46, 0.22, 0.22, 0.14, 0.14];

    for (let k = 0; k < 5; k++) {
      const ang = angles[k];
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const ax = basis.r[0] * ca + basis.u[0] * sa;
      const ay = basis.r[1] * ca + basis.u[1] * sa;
      const az = basis.r[2] * ca + basis.u[2] * sa;
      const sx = -basis.r[0] * sa + basis.u[0] * ca;
      const sy = -basis.r[1] * sa + basis.u[1] * ca;
      const sz = -basis.r[2] * sa + basis.u[2] * ca;
      const hood = hoods[k];
      const partId = mesh.nextPartId();

      mesh.addParametricPatch(
        4, 6,
        (uu, v) => {
          const u = uu * 2 - 1;
          const widthEnv = Math.sin(Math.pow(v, 0.68) * Math.PI) * 0.33 * radius;
          const cup = (1 - u * u) * 0.12 * radius * Math.sin(v * Math.PI);
          const radial = (0.08 + 0.96 * v) * radius;
          const fwd = (Math.sin(v * Math.PI * 0.85) * hood - 0.10 * v * v) * radius + cup;
          return [
            pos[0] + ax * radial + sx * u * widthEnv + basis.f[0] * fwd,
            pos[1] + ay * radial + sy * u * widthEnv + basis.f[1] * fwd,
            pos[2] + az * radial + sz * u * widthEnv + basis.f[2] * fwd
          ];
        },
        (uu, v) => {
          const u = uu * 2 - 1;
          let c = lerp3(colors.inner, colors.mid, v);
          c = lerp3(c, colors.edge, Math.pow(v, 1.65) * 0.65);
          if (Math.abs(u) < 0.13) {
            c = lerp3(c, colors.inner, 0.35 * (1 - v));
          }
          return c;
        },
        (uu, v) => 0.48 + 0.52 * Math.pow(v, 0.5),
        (uu, v) => (Math.abs(uu - 0.5) > 0.36 || v > 0.82) ? 0.55 : 0.0,
        () => 0.18,
        1, FLAG_DOUBLE_SIDED, 22, 0.68, partId
      );
    }

    const lipId = mesh.nextPartId();
    mesh.addParametricPatch(
      5, 6,
      (uu, v) => {
        const u = uu * 2 - 1;
        const tubeWrap = u * 1.18;
        const width = 0.24 * radius * Math.sin(Math.pow(v, 0.58) * Math.PI * 0.92);
        const fwd = (0.06 + 0.58 * v) * radius;
        const drop = (-0.05 - 0.38 * Math.pow(v, 1.35)) * radius;
        const side = Math.sin(tubeWrap) * width;
        const cupUp = (1 - Math.cos(tubeWrap)) * 0.15 * radius * (1 - 0.45 * v);
        return [
          pos[0] + basis.r[0] * side + basis.u[0] * (drop + cupUp) + basis.f[0] * fwd,
          pos[1] + basis.r[1] * side + basis.u[1] * (drop + cupUp) + basis.f[1] * fwd,
          pos[2] + basis.r[2] * side + basis.u[2] * (drop + cupUp) + basis.f[2] * fwd
        ];
      },
      (uu, v) => {
        const u = uu * 2 - 1;
        let c = lerp3(centerCol, [255, 244, 150], clamp(v * 0.65, 0, 1));
        const spotWave = Math.sin(u * 16.0 + v * 13.0) * Math.cos(u * 10.5 - v * 17.0);
        if (v > 0.38 && spotWave > 0.45) {
          c = lerp3(c, colors.inner, 0.88);
        }
        return c;

      (uu, v) => 0.72 + 0.28 * v,
      (uu, v) => v > 0.78 ? 0.65 : 0.0,
      () => 0.20,
      1, FLAG_DOUBLE_SIDED | FLAG_EMISSIVE_TIP, 22, 0.60, lipId
    );

  function addCallaLily(mesh, pos, dir, radius, colors, centerCol) {

  function addDaisy(mesh, pos, dir, radius, colors, centerCol) {
    const basis = buildBasis(dir[0], dir[1], dir[2]);
    const coreId = mesh.nextPartId();

    mesh.addParametricPatch(
      8, 4,
      (uu, v) => {
        const a = uu * Math.PI * 2;
        const phi = v * Math.PI * 0.48;
        const sp = Math.sin(phi), cp = Math.cos(phi);
        const rDome = radius * 0.27;
        return [
          pos[0] + (basis.r[0] * sp * Math.cos(a) + basis.u[0] * sp * Math.sin(a)) * rDome + basis.f[0] * (cp * rDome * 0.65 + 0.03 * radius),
          pos[1] + (basis.r[1] * sp * Math.cos(a) + basis.u[1] * sp * Math.sin(a)) * rDome + basis.f[1] * (cp * rDome * 0.65 + 0.03 * radius),
          pos[2] + (basis.r[2] * sp * Math.cos(a) + basis.u[2] * sp * Math.sin(a)) * rDome + basis.f[2] * (cp * rDome * 0.65 + 0.03 * radius)

    const petalCount = 18;
    for (let ip = 0; ip < petalCount; ip++) {
      const ang = (ip / petalCount) * Math.PI * 2;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const rx = basis.r[0] * ca + basis.u[0] * sa;
      const ry = basis.r[1] * ca + basis.u[1] * sa;
      const rz = basis.r[2] * ca + basis.u[2] * sa;
      const tx = -basis.r[0] * sa + basis.u[0] * ca;
      const ty = -basis.r[1] * sa + basis.u[1] * ca;
      const tz = -basis.r[2] * sa + basis.u[2] * ca;
      const partId = mesh.nextPartId();
      const tilt = (ip % 2 === 0 ? 1.24 : 1.38);

      mesh.addParametricPatch(
        2, 5,
        (uu, v) => {
          const u = uu * 2 - 1;
          const pW = radius * 0.115 * Math.sin(Math.pow(v, 0.5) * Math.PI * 0.90);
          const pLen = radius * 0.82;
          const out = radius * 0.22 + Math.sin(tilt * (0.75 + 0.28 * v)) * v * pLen;
          const fwd = 0.04 * radius + Math.cos(tilt * (0.75 + 0.28 * v)) * v * pLen;
          return [
            pos[0] + rx * out + tx * u * pW + basis.f[0] * fwd,
            pos[1] + ry * out + ty * u * pW + basis.f[1] * fwd,
            pos[2] + rz * out + tz * u * pW + basis.f[2] * fwd

        },
        (uu, v) => lerp3(colors.mid, colors.edge, v),
        (uu, v) => 0.52 + 0.48 * v,
        (uu, v) => v > 0.72 ? 0.55 : 0.0,

  function addSunflower(mesh, pos, dir, radius, colors, leafCol) {

    const discId = mesh.nextPartId();
    mesh.addParametricPatch(
      10, 5,
      (uu, v) => {
        const a = uu * Math.PI * 2;
        const rDisc = radius * 0.46 * v;
        const bump = (1 - v * v) * 0.09 * radius + 0.02 * radius * Math.cos(v * 14);
        return [
          pos[0] + (basis.r[0] * Math.cos(a) + basis.u[0] * Math.sin(a)) * rDisc + basis.f[0] * bump,

      (uu, v) => v > 0.72 ? lerp3([96, 46, 16], [194, 128, 22], (v - 0.72) / 0.28) : lerp3([54, 24, 10], [92, 44, 16], v / 0.72),
      (uu, v) => 0.45 + 0.45 * v,

      for (let ip = 0; ip < count; ip++) {
        const ang = (ip / count) * Math.PI * 2 + tier * 0.24;
        const ca = Math.cos(ang), sa = Math.sin(ang);
        const rx = basis.r[0] * ca + basis.u[0] * sa;
        const ry = basis.r[1] * ca + basis.u[1] * sa;

          2, 5,
          (uu, v) => {

            const pW = radius * 0.145 * Math.sin(Math.pow(v, 0.55) * Math.PI * 0.94) * (1 - 0.25 * v);
            const pLen = radius * 0.64;
            const out = radius * 0.40 + Math.sin(tilt * (0.85 + 0.18 * v)) * v * pLen;
            const fwd = (0.04 - tier * 0.03) * radius + Math.cos(tilt * (0.85 + 0.24 * v)) * v * pLen;
            return [
              pos[0] + rx * out + tx * u * pW + basis.f[0] * fwd,
              pos[1] + ry * out + ty * u * pW + basis.f[1] * fwd,
              pos[2] + rz * out + tz * u * pW + basis.f[2] * fwd

          (uu, v) => v > 0.72 ? 0.55 : 0.0,
          () => 0.16,
          2, FLAG_DOUBLE_SIDED, 14, 0.25, partId
        );
      }
    }
  }

  function addPeony(mesh, pos, dir, radius, colors, centerCol, leafCol, rng, dense = false) {
    const basis = buildBasis(dir[0], dir[1], dir[2]);
    addCalyx(mesh, pos, dir, radius * 0.55, leafCol, 0.12);
    const goldenAngle = 2.399963229728653;
    const count = 24;
    const steps = dense ? 4 : 5;

    for (let pIdx = 0; pIdx < count; pIdx++) {
      const t = pIdx / (count - 1);
      const ang = pIdx * goldenAngle + (rng() - 0.5) * 0.16;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const rx = basis.r[0] * ca + basis.u[0] * sa;
      const ry = basis.r[1] * ca + basis.u[1] * sa;
      const rz = basis.r[2] * ca + basis.u[2] * sa;
      const tx = -basis.r[0] * sa + basis.u[0] * ca;
      const ty = -basis.r[1] * sa + basis.u[1] * ca;
      const tz = -basis.r[2] * sa + basis.u[2] * ca;

      const baseR = radius * (0.04 + 0.44 * Math.pow(t, 0.78));
      const pH = radius * (0.48 + 0.36 * Math.pow(t, 0.6));
      const pW = radius * (0.34 + 0.42 * Math.pow(t, 0.65));
      const tiltOut = 0.25 + 1.08 * Math.pow(t, 0.85);
      const partId = mesh.nextPartId();

      mesh.addParametricPatch(
        steps, 4,
        (uu, v) => {
          const u = uu * 2 - 1;
          const ruffle = Math.sin(u * Math.PI * 3.0 + pIdx) * 0.065 * radius * Math.pow(v, 1.4);
          const widthEnv = Math.sin(Math.pow(v, 0.50) * Math.PI * 0.90);
          const phi = u * (0.82 + 0.36 * (1 - t));
          const outDist = baseR + v * pH * Math.sin(tiltOut) + ruffle - (1 - Math.cos(phi)) * pW * 0.36;
          const fwdDist = v * pH * Math.cos(tiltOut) + 0.10 * radius + ruffle * 0.5;
          const sideDist = Math.sin(phi) * pW * widthEnv;
          return [
            pos[0] + rx * outDist + tx * sideDist + basis.f[0] * fwdDist,
            pos[1] + ry * outDist + ty * sideDist + basis.f[1] * fwdDist,
            pos[2] + rz * outDist + tz * sideDist + basis.f[2] * fwdDist
          ];
        },
        (uu, v) => {
          let c = lerp3(colors.inner, colors.mid, clamp(t * 0.85 + v * 0.35, 0, 1));
          if (t < 0.20) c = lerp3(c, centerCol, 0.35);
          return lerp3(c, colors.edge, Math.pow(v, 1.45) * (0.55 + 0.45 * t));
        },
        (uu, v) => clamp((0.28 + 0.72 * Math.pow(t, 0.6)) * (0.40 + 0.60 * v), 0.24, 1.0),
        (uu, v) => v > 0.74 ? 0.55 : 0.0,
        () => 0.18 + 0.14 * t,
        0, FLAG_DOUBLE_SIDED, 10, 0.18, partId
      );
    }
  }

  function addLily(mesh, stems, pos, dir, radius, colors, centerCol) {
    const basis = buildBasis(dir[0], dir[1], dir[2]);
    for (let k = 0; k < 6; k++) {
      const ang = (k / 6) * Math.PI * 2 + (k % 2) * 0.04;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const rx = basis.r[0] * ca + basis.u[0] * sa;
      const ry = basis.r[1] * ca + basis.u[1] * sa;
      const rz = basis.r[2] * ca + basis.u[2] * sa;
      const tx = -basis.r[0] * sa + basis.u[0] * ca;
      const ty = -basis.r[1] * sa + basis.u[1] * ca;
      const tz = -basis.r[2] * sa + basis.u[2] * ca;
      const partId = mesh.nextPartId();

      mesh.addParametricPatch(
        4, 7,
        (uu, v) => {
          const u = uu * 2 - 1;
          const widthEnv = Math.sin(Math.pow(v, 0.62) * Math.PI) * 0.30 * radius;

          const flare = Math.pow(v, 1.25) * 0.92 * radius;
          const recurve = v > 0.55 ? Math.pow((v - 0.55) / 0.45, 2.0) * 0.34 * radius : 0;
          const fwd = (0.72 * v - recurve) * radius;
          const crease = Math.abs(u) * 0.06 * radius * Math.sin(v * Math.PI);
          return [
            pos[0] + rx * (flare + 0.05 * radius) + tx * u * widthEnv + basis.f[0] * (fwd + crease),
            pos[1] + ry * (flare + 0.05 * radius) + ty * u * widthEnv + basis.f[1] * (fwd + crease),
            pos[2] + rz * (flare + 0.05 * radius) + tz * u * widthEnv + basis.f[2] * (fwd + crease)
          ];
        },
        (uu, v) => {
          const u = uu * 2 - 1;
          let c = lerp3(colors.inner, colors.mid, clamp(v * 1.1, 0, 1));
          c = lerp3(c, colors.edge, Math.pow(v, 1.45) * 0.72);
          if (v < 0.65 && Math.sin(u * 14 + v * 16) > 0.62) {
            c = lerp3(c, colors.inner, 0.85);

          return c;
        },
        (uu, v) => 0.44 + 0.56 * Math.pow(v, 0.5),
        (uu, v) => (Math.abs(uu - 0.5) > 0.36 || v > 0.78) ? 0.5 : 0.0,
        () => 0.18,
        1, FLAG_DOUBLE_SIDED, 22, 0.58, partId
      );

      const sMid = [
        pos[0] + rx * 0.18 * radius + basis.f[0] * 0.48 * radius,
        pos[1] + ry * 0.18 * radius + basis.f[1] * 0.48 * radius,

        pos[0] + rx * 0.34 * radius + basis.f[0] * 0.82 * radius,
        pos[1] + ry * 0.34 * radius + basis.f[1] * 0.82 * radius,
        pos[2] + rz * 0.34 * radius + basis.f[2] * 0.82 * radius

      stems.addSegment(pos, sMid, [160, 210, 130], [230, 240, 180], 1, 0.14, 0.28, mesh.nextPartId(), 0);
      stems.addSegment(sMid, sTip, [230, 240, 180], centerCol, 1, 0.28, 0.36, mesh.nextPartId(), 42);
    }

  function addPincushionProtea(mesh, stems, pos, dir, radius, colors, rng) {
    const basis = buildBasis(dir[0], dir[1], dir[2]);
    const coreId = mesh.nextPartId();

    mesh.addParametricPatch(
      8, 5,
      (uu, v) => {
        const a = uu * Math.PI * 2;
        const phi = v * Math.PI * 0.56;
        const sp = Math.sin(phi), cp = Math.cos(phi);
        const rCore = radius * 0.36;
        return [
          pos[0] + (basis.r[0] * sp * Math.cos(a) + basis.u[0] * sp * Math.sin(a) + basis.f[0] * cp) * rCore,

    const goldenAngle = 2.399963229728653;
    const pinCount = 52;
    for (let i = 0; i < pinCount; i++) {

      const dz = basis.r[2] * sp * Math.cos(theta) + basis.u[2] * sp * Math.sin(theta) + basis.f[2] * cp;

      const pinLen = radius * (0.48 + 0.58 * (0.8 + 0.2 * rng()));

      const pMid = [
        pos[0] + dx * (radius * 0.34 + pinLen * 0.55) + basis.f[0] * (radius * 0.04 * sp),
        pos[1] + dy * (radius * 0.34 + pinLen * 0.55) + basis.f[1] * (radius * 0.04 * sp),
        pos[2] + dz * (radius * 0.34 + pinLen * 0.55) + basis.f[2] * (radius * 0.04 * sp)

      const pTip = [
        pos[0] + dx * (radius * 0.34 + pinLen) + basis.f[0] * (radius * 0.14 * sp),
        pos[1] + dy * (radius * 0.34 + pinLen) + basis.f[1] * (radius * 0.14 * sp),
        pos[2] + dz * (radius * 0.34 + pinLen) + basis.f[2] * (radius * 0.14 * sp)
